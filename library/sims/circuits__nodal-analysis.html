<head>
  <meta charset="UTF-8">

  <title>Nodal Analysis Step-Through</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.7/p5.min.js"></script>
  <script>/* Circuit Library for p5.js
 * This library provides functions to draw basic circuit components
 * such as resistors, capacitors, inductors, and batteries.
 * It supports both horizontal and vertical orientations, and is responsive
 * to different line widths and labels.
 * Dan McCreary - June 2025
 */
// Global variables for wire animation
let isRunning = false;
// Track animation time independently and update in draw loop with deltaTime
let animationTime = 0; 

// Default line for line width for all components
// overridden by individual component functions
let defaultLineWidth = 2;

// draw a black line with red circles as current from (x1,y1) to (y1,y2) 
// the speed of the electrons is controlled by the speed parameter
// Note that drawAnimatedWire function depends on the global variable animationTime
// which should be updated in the main draw loop like this:
// if (isRunning) {
//    animationTime += deltaTime;
// }
// Note that deltaTime is a p5.js builtin global that contains the amount of time 
// it took draw() to execute during the previous frame.

function drawAnimatedWire(x1, y1, x2, y2, speed, spacing) {
  // Calculate wire properties
  let distance = dist(x1, y1, x2, y2);
  let spacingPixels = spacing * 50; // Convert spacing to pixels
  let numElectrons = Math.floor(distance / spacingPixels);
  
  // Draw the wire
  stroke('black');
  strokeWeight(lineWidth);
  line(x1, y1, x2, y2);
  
  // Draw moving electrons (always draw them, but only move when running)
  if (numElectrons > 0) {
    fill('red');
    noStroke();
    
    for (let i = 0; i <= numElectrons; i++) {
      // Calculate electron position using animationTime instead of millis()
      let electronPos = (animationTime * speed + i * spacingPixels) % distance;
      let x = lerp(x1, x2, electronPos / distance);
      let y = lerp(y1, y2, electronPos / distance);
      
      // Draw electron as red circle
      let electronSize = 8; // Fixed size for simplicity
      circle(x, y, electronSize);
    }
  }
}

// Single drawBattery function with orientation support using rotation
// Note this is not a DC Power source symbol
function drawBattery(x, y, width, height, orientation) {
  push(); // Save current drawing state
  
  if (orientation === HORIZONTAL) {
    // For horizontal orientation, rotate the coordinate system
    translate(x + width/2, y + height/2); // Move to center of battery
    rotate(PI/2); // Rotate 90 degrees
    // Draw vertical battery centered at origin, but swap width/height for rotation
    drawVerticalBatteryAtOrigin(-height/2, -width/2, height, width);
  } else {
    // For vertical orientation, draw normally
    drawVerticalBatteryAtOrigin(x, y, width, height);
  }
  
  pop(); // Restore drawing state
}

// Helper function that draws a vertical battery at the specified position
function drawVerticalBatteryAtOrigin(x, y, width, height) {
  let goldTopPercent = 0.30;
  
  strokeWeight(2);
  
  // Draw gold top section (positive terminal)
  fill('gold');
  stroke('black');
  rect(x, y, width, height * goldTopPercent);
  
  // Draw black bottom section (negative terminal)
  fill('black');
  rect(x, y + height * goldTopPercent, width, height * (1 - goldTopPercent));
  
  // Draw the minus sign in white on the black section
  stroke('white');
  strokeWeight(2);
  line(x + width/4, y + height * 0.9, 
       x + width * 3/4, y + height * 0.9);
  
  // Draw the plus sign in black on the gold section
  stroke('black');
  strokeWeight(2);
  // Horizontal line of the "+"
  line(x + width/5, y + height * 0.15, 
       x + width * 4/5, y + height * 0.15);
  // Vertical line of the "+"
  line(x + width/2, y + height * 0.05, 
       x + width/2, y + height * 0.25);
}

function drawCapacitor(x, y, cwidth, cheight, lineWidth, orientation, label) {
  push(); // Save drawing state
  
  // Light gray background for debugging
  // fill(230);
  stroke('black');
  strokeWeight(1);
  // outline box for debugging
  // rect(x, y, cwidth, cheight);
  
  strokeWeight(2);
  stroke('black');
  noFill();
  
  // The percent of the length of the capacitor that is taken by each end wire
  let endWirePercent = 0.2;
  let endWireLength = cwidth * endWirePercent;
  
  // Gap between capacitor plates (as percentage of total length)
  let plateGapPercent = 0.1;
  let plateGap = cwidth * plateGapPercent;
  
  // Length of each capacitor plate
  let plateLength = cheight * 0.6; // Plates are 60% of the height
  
  if (orientation === HORIZONTAL) {
    let centerY = y + cheight / 2;
    let centerX = x + cwidth / 2;
    let plateStartY = centerY - plateLength / 2;
    let plateEndY = centerY + plateLength / 2;
    
    // Left end wire
    line(x, centerY, centerX - plateGap / 2, centerY);
    
    // Right end wire 
    line(centerX + plateGap / 2, centerY, x + cwidth, centerY);
    
    // Left plate (vertical line)
    line(centerX - plateGap / 2, plateStartY, centerX - plateGap / 2, plateEndY);
    
    // Right plate (vertical line)
    line(centerX + plateGap / 2, plateStartY, centerX + plateGap / 2, plateEndY);
    
    // Draw label below capacitor
    fill('black');
    noStroke();
    textAlign(CENTER, TOP);
    textSize(14);
    text(label, x + cwidth / 2, y + cheight + 5);
    
  } else if (orientation === VERTICAL) {
    let centerX = x + cwidth / 2;
    let centerY = y + cheight / 2;
    endWireLength = cheight * endWirePercent;
    plateGap = cheight * plateGapPercent;
    plateLength = cwidth * 0.6; // Plates are 60% of the width
    let plateStartX = centerX - plateLength / 2;
    let plateEndX = centerX + plateLength / 2;
    
    // Top end wire
    line(centerX, y, centerX, centerY - plateGap / 2);
    
    // Bottom end wire
    line(centerX, centerY + plateGap / 2, centerX, y + cheight);
    
    // Top plate (horizontal line)
    line(plateStartX, centerY - plateGap / 2, plateEndX, centerY - plateGap / 2);
    
    // Bottom plate (horizontal line)
    line(plateStartX, centerY + plateGap / 2, plateEndX, centerY + plateGap / 2);
    
    // Draw label to the right of capacitor
    fill('black');
    noStroke();
    textAlign(LEFT, CENTER);
    textSize(14);
    text(label, x + cwidth + 10, y + cheight / 2);
  }
  
  pop(); // Restore drawing state
}

function drawInductor(x, y, iwidth, iheight, lineWidth, orientation, label) {
  push(); // Save drawing state
  
  // Should be global parameter lineWidth
  strokeWeight(2);
  stroke('black');
  noFill();
  
  // The percent of the length of the inductor that is taken by each end wire
  let endWirePercent = 0.15;
  let endWireLength = iwidth * endWirePercent;
  
  // Number of coils in the inductor symbol
  let numCoils = 4;
  let coilsWidth = iwidth - 2 * endWireLength;
  let coilWidth = coilsWidth / numCoils;
  let coilRadius = iheight / 3; // Radius of each semicircular coil
  
  if (orientation === HORIZONTAL) {
    let centerY = y + iheight / 2;
    
    // Left end wire
    line(x, centerY, x + endWireLength, centerY);
    
    // Right end wire 
    line(x + iwidth - endWireLength, centerY, x + iwidth, centerY);
    
    // Draw coils (all facing upward like wound wire)
    for (let i = 0; i < numCoils; i++) {
      let coilStartX = x + endWireLength + i * coilWidth;
      let coilEndX = coilStartX + coilWidth;
      
      // Each coil is a semicircle sitting on the centerline, all facing upward
      arc(coilStartX + coilWidth/2, centerY, coilWidth, coilRadius * 2, PI, TWO_PI);
    }
    
    // Draw label below inductor
    fill('black');
    noStroke();
    textAlign(CENTER, TOP);
    textSize(14);
    text(label, x + iwidth / 2, y + iheight + 5);
    
  } else if (orientation === VERTICAL) {
    let centerX = x + iwidth / 2;
    endWireLength = iheight * endWirePercent;
    coilsWidth = iheight - 2 * endWireLength;
    coilWidth = coilsWidth / numCoils;
    coilRadius = iwidth / 3; // Radius of each semicircular coil
    
    // Top end wire
    line(centerX, y, centerX, y + endWireLength);
    
    // Bottom end wire
    line(centerX, y + iheight - endWireLength, centerX, y + iheight);
    
    // Draw coils (all facing right like wound wire)
    for (let i = 0; i < numCoils; i++) {
      let coilStartY = y + endWireLength + i * coilWidth;
      let coilEndY = coilStartY + coilWidth;
      
      // Each coil is a semicircle sitting on the centerline, all facing right
      arc(centerX, coilStartY + coilWidth/2, coilRadius * 2, coilWidth, PI + HALF_PI, HALF_PI);
    }
    
    // Draw label to the right of inductor
    fill('black');
    noStroke();
    textAlign(LEFT, CENTER);
    textSize(14);
    text(label, x + iwidth + 10, y + iheight / 2);
  }
  
  pop(); // Restore drawing state
}

// draw an on/off switch at (x,y) of length l
// Orientation parameter HORIZONTAL or VERTICAL
function drawSwitch(x, y, len, isClosed, orientation) {
  circle(x, y, 4);
  // Draw the switch based on orientation
  if (orientation === HORIZONTAL) {
    circle(x+len, y, 4)
    stroke(0);
    strokeWeight(3);
    fill('black');
    if(isClosed) {
      line(x, y, x + len, y);
      strokeWeight(0);
      text('on', x+15, y-10)
    } else {
      line(x, y, x + len * .8, y - len * .6);
      strokeWeight(0);
      text('off', x + 20, y);
    }
    // Draw the vertical switch
  } else {
    circle(x, y+len, 4)
    stroke(0);
    strokeWeight(2);
    fill('black');
    if(isClosed) {
      line(x, y, x, y + len);
      strokeWeight(0);
      text('on',x+7,y+29);
    } else { 
      line(x, y, x + len*.8, y + len * .6);
      strokeWeight(0);
      text('off', x , y+29);
    }
  }
}

function drawResistor(x, y, rwidth, rheight, lineWidth, orientation, label, labelPosition) {
  push(); // Save drawing state

  // Set stroke properties for the resistor
  strokeWeight(lineWidth || 2);
  stroke('black');
  noFill();
  
  // The percent of the length of the resistor that is taken by each end wire
  let endWirePercent = 0.15;
  let endWireLength = rwidth * endWirePercent;
  
  // Number of zig-zag peaks (international symbol uses 6)
  let peaks = 6;
  let peakWidth = (rwidth - 2 * endWireLength) / peaks;
  let peakHeight = rheight / 3;
  
  if (orientation === HORIZONTAL) {
    let halfHeight = y + rheight / 2;
    
    // Left end wire
    line(x, halfHeight, x + endWireLength, halfHeight);
    
    // Right end wire 
    line(x + rwidth - endWireLength, halfHeight, x + rwidth, halfHeight);
    
    // Zigzag pattern
    beginShape();
    noFill();
    vertex(x + endWireLength, halfHeight);
    for (let i = 0; i <= peaks - 1; i++) {
      let xPos = x + endWireLength + i * peakWidth + peakWidth / 2;
      let yPos = (i % 2 === 0) ? 
          halfHeight - peakHeight : 
          halfHeight + peakHeight;
      vertex(xPos, yPos);
    }
    vertex(x + rwidth - endWireLength, halfHeight);
    endShape();
    
    // Draw label with position support
    if (label) {
      fill('black');
      noStroke();
      textSize(12);
      let cx = x + rwidth / 2;
      let halfHeight = y + rheight / 2;
      if (labelPosition === LEFT) {
        textAlign(RIGHT, CENTER);
        text(label, x - 4, halfHeight);
      } else if (labelPosition === RIGHT) {
        textAlign(LEFT, CENTER);
        text(label, x + rwidth + 4, halfHeight);
      } else if (labelPosition === BOTTOM) {
        textAlign(CENTER, TOP);
        text(label, cx, y + rheight + 3);
      } else {
        // TOP is default
        textAlign(CENTER, BOTTOM);
        text(label, cx, y - 3);
      }
    }

  } else if (orientation === VERTICAL) {
    let halfWidth = x + rwidth / 2;
    endWireLength = rheight * endWirePercent;
    peakHeight = rwidth / 3;
    peakWidth = (rheight - 2 * endWireLength) / peaks;

    // Top end wire
    line(halfWidth, y, halfWidth, y + endWireLength);

    // Bottom end wire
    line(halfWidth, y + rheight - endWireLength, halfWidth, y + rheight);

    // Zigzag pattern
    beginShape();
    noFill();
    vertex(halfWidth, y + endWireLength);
    for (let i = 0; i <= peaks - 1; i++) {
      let yPos = y + endWireLength + i * peakWidth + peakWidth / 2;
      let xPos = (i % 2 === 0) ?
        halfWidth - peakHeight :
        halfWidth + peakHeight;
      vertex(xPos, yPos);
    }
    vertex(halfWidth, y + rheight - endWireLength);
    endShape();

    // Draw label with position support
    if (label) {
      fill('black');
      noStroke();
      textSize(12);
      let cy = y + rheight / 2;
      if (labelPosition === TOP) {
        textAlign(CENTER, BOTTOM);
        text(label, halfWidth, y - 3);
      } else if (labelPosition === BOTTOM) {
        textAlign(CENTER, TOP);
        text(label, halfWidth, y + rheight + 3);
      } else if (labelPosition === RIGHT) {
        textAlign(LEFT, CENTER);
        text(label, x + rwidth + 4, cy);
      } else {
        // LEFT is default for vertical
        textAlign(RIGHT, CENTER);
        text(label, x - 4, cy);
      }
    }
  }
  
  pop(); // Restore drawing state
}</script>

<script>
// Nodal Analysis Step-Through MicroSim
// Walks through the complete nodal analysis procedure for a three-node circuit.
//
// Circuit values (chosen for clean integer solutions):
//   Vs = 10V  R1 = 1kΩ  R2 = 2kΩ  R3 = 2kΩ  R4 = 4kΩ
// Solution:   V1 = 6V   V2 = 4V
// Branch currents: I_R1=4mA  I_R2=3mA  I_R3=1mA  I_R4=1mA
//
// Bloom Level: Apply (L3) — execute the nodal analysis procedure

// ── Canvas layout ─────────────────────────────────────────────────────────────
const CW     = 660;   // canvas width (fixed)
const DRAW_H = 480;   // drawing region height
const CTRL_H = 80;    // controls strip height
const CH     = DRAW_H + CTRL_H;  // 560

// ── Panel split ───────────────────────────────────────────────────────────────
const CIRC_W = 450;              // left (circuit) panel width
const EQ_X   = 458;              // equation panel x-start
const EQ_W   = CW - EQ_X - 4;   // ~198px

// ── Circuit node positions ────────────────────────────────────────────────────
const VS_X   = 65;   // voltage source x-center
const V1_X   = 240;  // V1 node x
const V2_X   = 390;  // V2 node x
const TOP_Y  = 120;  // top rail y
const GND_Y  = 380;  // ground rail y
const SRC_CY = 250;  // voltage source circle center y
const SRC_R  = 38;   // voltage source circle radius

// ── Step state ────────────────────────────────────────────────────────────────
let currentStep = 1;
const TOTAL_STEPS = 6;
let showAllCurrents = false;

// ── Canvas-based controls ─────────────────────────────────────────────────────
let btnPrev, btnNext, btnReset, cbCurrents;

// ── Orientation constants (not defined by p5.js or circuit-lib.js) ───────────
const HORIZONTAL = 0;
const VERTICAL   = 1;

// ── lineWidth global required by circuit-lib.js ───────────────────────────────
let lineWidth = 2;

// ─────────────────────────────────────────────────────────────────────────────
function setup() {
  const canvas = createCanvas(CW, CH);
  canvas.parent(document.querySelector('main') || document.body);

  const BY = DRAW_H + 22;
  const BH = 30;
  btnPrev    = { x: 15,  y: BY, w: 90,  h: BH, label: '← Prev' };
  btnNext    = { x: 115, y: BY, w: 110, h: BH, label: 'Next Step →' };
  btnReset   = { x: 235, y: BY, w: 70,  h: BH, label: 'Reset' };
  cbCurrents = { x: 320, y: BY + 6, sz: 18, label: 'Show All Currents' };

  describe('Nodal analysis step-through: six steps from node identification through branch current calculation', LABEL);
}

function draw() {
  background(240);

  // Drawing region
  fill('aliceblue');
  stroke('silver');
  strokeWeight(1);
  rect(0, 0, CW, DRAW_H);

  // Equation panel background
  fill(255, 255, 220);
  stroke('#ccc');
  strokeWeight(1);
  rect(EQ_X - 3, 5, EQ_W + 3, DRAW_H - 10, 6);

  // Control strip
  fill(245);
  stroke('silver');
  strokeWeight(1);
  rect(0, DRAW_H, CW, CTRL_H);

  // Panel divider line
  stroke(200);
  strokeWeight(1);
  line(CIRC_W, 10, CIRC_W, DRAW_H - 10);

  // Title
  fill(30);
  noStroke();
  textFont('sans-serif');
  textSize(17);
  textAlign(CENTER, TOP);
  text('Nodal Analysis — Three-Node Circuit', CIRC_W / 2, 10);

  // Draw layers in order
  drawCircuit();
  drawHighlights();
  if (showAllCurrents || currentStep >= 2) {
    drawCurrentArrows(showAllCurrents || currentStep === 6);
  }
  drawEquationPanel();
  drawControls();
}

// ─────────────────────────────────────────────────────────────────────────────
// CIRCUIT DRAWING
// ─────────────────────────────────────────────────────────────────────────────

function drawCircuit() {
  stroke(0);
  strokeWeight(lineWidth);
  noFill();

  // ── Voltage source (left vertical arm) ──
  // Wire: VS+ terminal (top rail) → top of circle
  line(VS_X, TOP_Y, VS_X, SRC_CY - SRC_R);
  // Wire: bottom of circle → GND rail
  line(VS_X, SRC_CY + SRC_R, VS_X, GND_Y);
  // Circle symbol
  noFill(); stroke(0); strokeWeight(lineWidth);
  circle(VS_X, SRC_CY, SRC_R * 2);
  // + / − inside
  fill(0); noStroke();
  textFont('sans-serif');
  textSize(16); textAlign(CENTER, CENTER);
  text('+', VS_X, SRC_CY - 15);
  text('−', VS_X, SRC_CY + 15);
  // Value label (right of source circle, clear of R1 which is at TOP_Y=120)
  textSize(12); textAlign(LEFT, CENTER);
  text('Vs=10V', VS_X + SRC_R + 6, SRC_CY);

  stroke(0); strokeWeight(lineWidth); noFill();

  // ── Top rail: VS+ → R1 → V1 ──
  line(VS_X, TOP_Y, VS_X + 25, TOP_Y);                           // pre-R1 wire
  drawResistor(VS_X + 25, TOP_Y - 20, 120, 40, lineWidth, HORIZONTAL, 'R1=1kΩ', TOP);
  line(VS_X + 25 + 120, TOP_Y, V1_X, TOP_Y);                    // post-R1 wire

  // ── Top rail: V1 → R3 → V2 ──
  line(V1_X, TOP_Y, V1_X + 15, TOP_Y);                           // pre-R3 wire
  drawResistor(V1_X + 15, TOP_Y - 20, 105, 40, lineWidth, HORIZONTAL, 'R3=2kΩ', TOP);
  line(V1_X + 15 + 105, TOP_Y, V2_X, TOP_Y);                    // post-R3 wire

  // ── R2 vertical: V1 → GND (midline at V1_X) ──
  drawResistor(V1_X - 12, TOP_Y, 24, GND_Y - TOP_Y, lineWidth, VERTICAL, 'R2=2kΩ', RIGHT);

  // ── R4 vertical: V2 → GND (midline at V2_X) ──
  drawResistor(V2_X - 12, TOP_Y, 24, GND_Y - TOP_Y, lineWidth, VERTICAL, 'R4=4kΩ', RIGHT);

  // ── Bottom ground rail ──
  stroke(0); strokeWeight(lineWidth);
  line(VS_X, GND_Y, V2_X, GND_Y);

  // ── GND symbols ──
  drawGND(VS_X,  GND_Y);
  drawGND(V1_X,  GND_Y);
  drawGND(V2_X,  GND_Y);

  // ── Node junction dots ──
  fill(40, 80, 210);
  noStroke();
  circle(V1_X, TOP_Y, 14);
  circle(V2_X, TOP_Y, 14);

  // ── Node labels ──
  fill(0); noStroke();
  textFont('sans-serif');
  textSize(14); textAlign(CENTER, BOTTOM);
  text('V₁', V1_X, TOP_Y - 30);
  text('V₂', V2_X, TOP_Y - 30);

  // ── Solved voltage callouts (steps 5 & 6) ──
  if (currentStep >= 5) {
    fill(0, 130, 20); noStroke();
    textStyle(BOLD); textSize(14);
    text('6V', V1_X, TOP_Y - 47);
    text('4V', V2_X, TOP_Y - 47);
    textStyle(NORMAL);
  }
}

function drawGND(x, y) {
  stroke(0); strokeWeight(lineWidth);
  line(x,       y,      x,      y + 10);
  line(x - 14,  y + 10, x + 14, y + 10);
  line(x - 9,   y + 17, x + 9,  y + 17);
  line(x - 4,   y + 23, x + 4,  y + 23);
}

// ─────────────────────────────────────────────────────────────────────────────
// HIGHLIGHTS PER STEP
// ─────────────────────────────────────────────────────────────────────────────

function drawHighlights() {
  noStroke();
  const colV    = GND_Y - TOP_Y + 80;
  const colTopY = TOP_Y - 65;
  switch (currentStep) {
    case 1:
      // Highlight all nodes (yellow halos)
      fill(255, 210, 0, 100);
      circle(V1_X, TOP_Y, 48);
      circle(V2_X, TOP_Y, 48);
      circle(VS_X, TOP_Y, 32);
      circle(V1_X, GND_Y, 32);
      circle(V2_X, GND_Y, 32);
      circle(VS_X, GND_Y, 32);
      // GND reference note
      fill(50, 120, 50); noStroke();
      textFont('sans-serif'); textSize(11); textAlign(LEFT, TOP);
      text('← GND = 0V reference', VS_X + 10, GND_Y + 30);
      break;
    case 2:
      // Highlight V1 column
      fill(255, 200, 40, 80);
      rect(V1_X - 52, colTopY, 104, colV, 10);
      break;
    case 3:
      // Highlight V2 column
      fill(255, 200, 40, 80);
      rect(V2_X - 52, colTopY, 104, colV, 10);
      break;
    case 4:
      // Both columns — blue tint for matrix context
      fill(100, 170, 255, 70);
      rect(V1_X - 52, colTopY, 104, colV, 10);
      rect(V2_X - 52, colTopY, 104, colV, 10);
      break;
    case 5:
      // Green glow — solution found
      fill(0, 210, 90, 110);
      circle(V1_X, TOP_Y, 58);
      circle(V2_X, TOP_Y, 58);
      break;
    case 6:
      // Orange tint over the entire top rail (all branches active)
      fill(255, 140, 0, 55);
      rect(VS_X - 10, TOP_Y - 70, V2_X - VS_X + 20, 85, 8);
      break;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// CURRENT DIRECTION ARROWS
// ─────────────────────────────────────────────────────────────────────────────

function drawCurrentArrows(showValues) {
  const arY = TOP_Y - 65;  // y position of horizontal arrows (above R labels)

  // I_R1: rightward above R1 (Vs → V1)
  drawArrow(VS_X + 55, arY, VS_X + 115, arY, color(180, 30, 30));
  // I_R2: downward through R2 (V1 → GND)
  drawArrow(V1_X + 30, TOP_Y + 100, V1_X + 30, TOP_Y + 170, color(180, 30, 30));
  // I_R3: rightward above R3 (V1 → V2)
  drawArrow(V1_X + 50, arY, V1_X + 90, arY, color(180, 30, 30));
  // I_R4: downward through R4 (V2 → GND)
  drawArrow(V2_X + 30, TOP_Y + 100, V2_X + 30, TOP_Y + 170, color(180, 30, 30));

  if (showValues) {
    fill(150, 20, 20); noStroke();
    textFont('sans-serif'); textSize(11); textAlign(CENTER, CENTER);
    text('4mA', VS_X + 85, arY - 12);
    text('3mA', V1_X + 48, TOP_Y + 140);
    text('1mA', V1_X + 70, arY - 12);
    text('1mA', V2_X + 48, TOP_Y + 140);
  }
}

function drawArrow(x1, y1, x2, y2, col) {
  push();
  stroke(col); fill(col); strokeWeight(1.5);
  line(x1, y1, x2, y2);
  let ang = atan2(y2 - y1, x2 - x1);
  translate(x2, y2);
  rotate(ang);
  triangle(0, 0, -10, -5, -10, 5);
  pop();
}

// ─────────────────────────────────────────────────────────────────────────────
// EQUATION PANEL
// ─────────────────────────────────────────────────────────────────────────────

function drawEquationPanel() {
  const px = EQ_X + 5;
  let   py = 22;
  const lh = 20;

  // Step title
  const titles = [
    'Step 1: Identify Nodes',
    'Step 2: KCL at Node V\u2081',
    'Step 3: KCL at Node V\u2082',
    'Step 4: Matrix Form',
    'Step 5: Solve',
    'Step 6: Branch Currents'
  ];
  fill(20, 55, 160); noStroke();
  textFont('sans-serif');
  textSize(13); textStyle(BOLD); textAlign(LEFT, TOP);
  text(titles[currentStep - 1], px, py);
  textStyle(NORMAL);
  py += 28;

  // Divider
  stroke(190); strokeWeight(1);
  line(px, py, EQ_X + EQ_W - 6, py);
  noStroke(); py += 10;

  textFont('monospace');
  textSize(11); textAlign(LEFT, TOP);

  switch (currentStep) {
    case 1:
      eqLines(px, py, lh, [
        ['k', 'Nodes:'],
        ['n', 'GND  = 0V (ref.)'],
        ['n', 'V\u2081   = ? (unknown)'],
        ['n', 'V\u2082   = ? (unknown)'],
        ['w', ''],
        ['k', 'Component values:'],
        ['d', 'Vs = 10 V'],
        ['d', 'R1 = 1 k\u03A9'],
        ['d', 'R2 = 2 k\u03A9'],
        ['d', 'R3 = 2 k\u03A9'],
        ['d', 'R4 = 4 k\u03A9'],
      ]);
      break;

    case 2:
      eqLines(px, py, lh, [
        ['k', '\u03A3 currents leaving V\u2081:'],
        ['w', ''],
        ['p', '(V\u2081-Vs)/R1 + V\u2081/R2'],
        ['p', '  + (V\u2081-V\u2082)/R3 = 0'],
        ['w', ''],
        ['k', 'Multiply \xD7 2k\u03A9:'],
        ['p', '2(V\u2081-10)+V\u2081'],
        ['p', '  +(V\u2081-V\u2082)=0'],
        ['p', '4V\u2081 - V\u2082 = 20'],
        ['w', ''],
        ['g', '\u25BA Eq.(1):'],
        ['g', '  4V\u2081 - V\u2082 = 20'],
      ]);
      break;

    case 3:
      eqLines(px, py, lh, [
        ['k', '\u03A3 currents leaving V\u2082:'],
        ['w', ''],
        ['p', '(V\u2082-V\u2081)/R3'],
        ['p', '  + V\u2082/R4 = 0'],
        ['w', ''],
        ['k', 'Multiply \xD7 4k\u03A9:'],
        ['p', '2(V\u2082-V\u2081) + V\u2082 = 0'],
        ['w', ''],
        ['g', '\u25BA Eq.(2):'],
        ['g', '  -2V\u2081 + 3V\u2082 = 0'],
      ]);
      break;

    case 4:
      eqLines(px, py, lh, [
        ['k', 'System AX = b:'],
        ['w', ''],
        ['n', '| 4  -1| |V\u2081|   |20|'],
        ['n', '|-2   3| |V\u2082| = | 0|'],
        ['w', ''],
        ['d', 'Row 1 \u2190 Eq.(1):'],
        ['d', '  4V\u2081 - V\u2082 = 20'],
        ['w', ''],
        ['d', 'Row 2 \u2190 Eq.(2):'],
        ['d', '  -2V\u2081 + 3V\u2082 = 0'],
      ]);
      break;

    case 5:
      eqLines(px, py, lh, [
        ['k', 'From Eq.(2):'],
        ['p', '-2V\u2081 + 3V\u2082 = 0'],
        ['p', 'V\u2081 = 3V\u2082 / 2'],
        ['w', ''],
        ['k', 'Sub into Eq.(1):'],
        ['p', '4(3V\u2082/2) - V\u2082 = 20'],
        ['p', '6V\u2082 - V\u2082 = 20'],
        ['p', '5V\u2082 = 20'],
        ['w', ''],
        ['G', '\u25BA V\u2082 = 4 V'],
        ['G', '\u25BA V\u2081 = 3\xD74/2 = 6 V'],
      ]);
      break;

    case 6:
      eqLines(px, py, lh, [
        ['k', 'I = (V_high - V_low)/R'],
        ['w', ''],
        ['r', 'I1=(10-6)/1k = 4 mA'],
        ['r', 'I2= 6/2k    = 3 mA'],
        ['r', 'I3=(6-4)/2k = 1 mA'],
        ['r', 'I4= 4/4k    = 1 mA'],
        ['w', ''],
        ['g', 'KCL check @ V\u2081:'],
        ['g', 'I1 = I2 + I3'],
        ['g', '4 = 3 + 1  \u2713'],
        ['g', ''],
        ['g', 'KCL check @ V\u2082:'],
        ['g', 'I3 = I4'],
        ['g', '1 = 1  \u2713'],
      ]);
      break;
  }
}

// Draw an array of [colorCode, text] lines
// Color codes: k=black/label  d=dark  n=navy  p=purple  g=green  G=bold-green
//              r=red  w=blank
function eqLines(px, py, lh, lines) {
  for (let [c, t] of lines) {
    if      (c === 'n') fill(0, 40, 160);
    else if (c === 'p') fill(110, 0, 160);
    else if (c === 'g') fill(0, 130, 30);
    else if (c === 'G') { fill(0, 130, 30); textStyle(BOLD); }
    else if (c === 'r') fill(160, 20, 20);
    else if (c === 'd') fill(60);
    else if (c === 'k') { fill(40); textStyle(BOLD); }
    else fill(240, 240, 240);  // 'w' = invisible (blank line)
    noStroke(); text(t, px, py);
    textStyle(NORMAL);
    py += lh;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// CONTROLS
// ─────────────────────────────────────────────────────────────────────────────

function drawControls() {
  drawBtn(btnPrev,  currentStep > 1);
  drawBtn(btnNext,  currentStep < TOTAL_STEPS);
  drawBtn(btnReset, true);

  // Checkbox background
  stroke(90); strokeWeight(1.5);
  fill(255);
  rect(cbCurrents.x, cbCurrents.y, cbCurrents.sz, cbCurrents.sz, 3);
  if (showAllCurrents) {
    // Checkmark
    stroke(0, 140, 0); strokeWeight(2.5); noFill();
    let cx = cbCurrents.x, cy = cbCurrents.y, sz = cbCurrents.sz;
    line(cx + 3, cy + sz * 0.5, cx + sz * 0.45, cy + sz - 4);
    line(cx + sz * 0.45, cy + sz - 4, cx + sz - 2, cy + 3);
  }
  fill(40); noStroke();
  textFont('sans-serif'); textSize(13); textAlign(LEFT, CENTER);
  text(cbCurrents.label,
       cbCurrents.x + cbCurrents.sz + 6,
       cbCurrents.y + cbCurrents.sz / 2);

  // Step indicator
  fill(70); noStroke();
  textSize(13); textAlign(CENTER, CENTER);
  text('Step ' + currentStep + ' / ' + TOTAL_STEPS,
       CW - 60, DRAW_H + CTRL_H / 2);
}

function drawBtn(b, enabled) {
  fill(enabled ? color(55, 115, 200) : color(175));
  stroke(enabled ? color(35, 85, 165) : color(145));
  strokeWeight(1);
  rect(b.x, b.y, b.w, b.h, 5);
  fill(255); noStroke();
  textFont('sans-serif'); textSize(13); textAlign(CENTER, CENTER);
  text(b.label, b.x + b.w / 2, b.y + b.h / 2);
}

// ─────────────────────────────────────────────────────────────────────────────
// INTERACTION
// ─────────────────────────────────────────────────────────────────────────────

function mousePressed() {
  if (inBtn(btnPrev) && currentStep > 1) {
    currentStep--;
  } else if (inBtn(btnNext) && currentStep < TOTAL_STEPS) {
    currentStep++;
  } else if (inBtn(btnReset)) {
    currentStep = 1;
    showAllCurrents = false;
  } else {
    let cx = cbCurrents.x, cy = cbCurrents.y, sz = cbCurrents.sz;
    if (mouseX >= cx && mouseX <= cx + sz &&
        mouseY >= cy && mouseY <= cy + sz) {
      showAllCurrents = !showAllCurrents;
    }
  }
}

function inBtn(b) {
  return mouseX >= b.x && mouseX <= b.x + b.w &&
         mouseY >= b.y && mouseY <= b.y + b.h;
}

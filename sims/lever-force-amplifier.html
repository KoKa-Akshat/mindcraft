<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lever Force Amplifier</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js"></script>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    background: #e9e9e9;
    font-family: Arial, Helvetica, sans-serif;
  }
  #sketch-holder {
    margin: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>
  <div id="sketch-holder"></div>
  <script>
// Lever Force Amplifier MicroSim

let fulcrumSlider, effortSlider, resetButton;
let currentAngle = 0;

// Layout / physics constants
const canvasW = 760, canvasH = 570;
const leftX = 180, rightX = 580, beamLen = 400;
const apexY = 220, baseY = 265;
const pxPerM = 100;       // pixels per meter along beam
const loadForce = 50;     // fixed load force in Newtons
const maxAngleDeg = 10;
const maxNet = 250;

// Computed-each-frame globals
let f, fulcrumX, effortArmPx, loadArmPx, effortArmM, loadArmM;
let mechAdv, effortForce, requiredEffort, torqueEffort, torqueLoad, netTorque;

function setup() {
  let cnv = createCanvas(canvasW, canvasH);
  cnv.parent('sketch-holder');
  textFont('Arial');

  fulcrumSlider = createSlider(0.15, 0.85, 0.5, 0.01);
  fulcrumSlider.position(40, 500);
  fulcrumSlider.style('width', '280px');

  effortSlider = createSlider(0, 150, 40, 1);
  effortSlider.position(400, 500);
  effortSlider.style('width', '220px');

  resetButton = createButton('Reset');
  resetButton.position(650, 495);
  resetButton.size(70, 32);
  resetButton.mousePressed(() => {
    fulcrumSlider.value(0.5);
    effortSlider.value(40);
  });
}

function computePhysics() {
  f = fulcrumSlider.value();
  fulcrumX = leftX + f * beamLen;
  effortArmPx = fulcrumX - leftX;
  loadArmPx = rightX - fulcrumX;
  effortArmM = effortArmPx / pxPerM;
  loadArmM = loadArmPx / pxPerM;
  mechAdv = effortArmM / loadArmM;
  effortForce = effortSlider.value();
  requiredEffort = (loadForce * loadArmM) / effortArmM;
  torqueEffort = effortForce * effortArmM;
  torqueLoad = loadForce * loadArmM;
  netTorque = torqueEffort - torqueLoad;

  let thetaTargetDeg = map(
    constrain(netTorque, -maxNet, maxNet),
    -maxNet, maxNet,
    maxAngleDeg, -maxAngleDeg
  );
  currentAngle = lerp(currentAngle, radians(thetaTargetDeg), 0.08);
}

function draw() {
  computePhysics();
  background(250);

  drawTitle();
  drawVisualization();
  drawReadouts();
  drawStatus();
  drawControlLabels();
}

function drawTitle() {
  noStroke();
  fill(25);
  textAlign(CENTER, CENTER);
  textSize(26);
  textStyle(BOLD);
  text('Lever Force Amplifier', canvasW / 2, 26);
  textStyle(NORMAL);
  fill(100);
  textSize(13);
  text('Adjust the fulcrum position and effort force to see how a lever amplifies force.', canvasW / 2, 46);
}

function drawVisualization() {
  // ---- Sub-band A: arm-length reference bar ----
  const refY = 88;
  strokeWeight(6);
  stroke(60, 110, 200);
  line(leftX, refY, fulcrumX, refY);
  stroke(230, 120, 40);
  line(fulcrumX, refY, rightX, refY);

  stroke(0);
  strokeWeight(2);
  line(fulcrumX, refY - 6, fulcrumX, refY + 6);

  noStroke();
  textAlign(CENTER, CENTER);
  textSize(13);
  fill(40, 90, 170);
  text('Effort Arm: ' + effortArmM.toFixed(2) + ' m', (leftX + fulcrumX) / 2, 74);
  fill(190, 100, 30);
  text('Load Arm: ' + loadArmM.toFixed(2) + ' m', (fulcrumX + rightX) / 2, 74);

  // ---- Sub-band B: the mechanism ----
  // ground hatching
  stroke(140);
  strokeWeight(1);
  line(fulcrumX - 45, baseY, fulcrumX + 45, baseY);
  for (let i = -40; i <= 40; i += 10) {
    line(fulcrumX + i, baseY, fulcrumX + i - 6, baseY + 8);
  }

  // pivot triangle
  noStroke();
  fill(120);
  triangle(fulcrumX - 28, baseY, fulcrumX + 28, baseY, fulcrumX, apexY);

  // rotated beam endpoints
  const theta = currentAngle;
  const leftDX = leftX - fulcrumX;
  const rightDX = rightX - fulcrumX;
  const leftPt = { x: fulcrumX + leftDX * cos(theta), y: apexY + leftDX * sin(theta) };
  const rightPt = { x: fulcrumX + rightDX * cos(theta), y: apexY + rightDX * sin(theta) };
  const pivotPt = { x: fulcrumX, y: apexY };

  strokeWeight(10);
  stroke(60, 110, 200);
  line(leftPt.x, leftPt.y, pivotPt.x, pivotPt.y);
  stroke(230, 120, 40);
  line(pivotPt.x, pivotPt.y, rightPt.x, rightPt.y);

  noStroke();
  fill(90);
  circle(pivotPt.x, pivotPt.y, 14);

  // load box
  push();
  rectMode(CENTER);
  stroke(150, 80, 20);
  strokeWeight(2);
  fill(230, 120, 40);
  rect(rightPt.x, rightPt.y - 25, 32, 32, 4);
  pop();
  noStroke();
  fill(255);
  textAlign(CENTER, CENTER);
  textSize(11);
  text('50N', rightPt.x, rightPt.y - 25);

  // effort force arrow
  const arrowLen = map(effortForce, 0, 150, 12, 35);
  const tailY = leftPt.y - arrowLen - 6;
  stroke(60, 110, 200);
  strokeWeight(4);
  line(leftPt.x, tailY, leftPt.x, leftPt.y - 6);
  noStroke();
  fill(60, 110, 200);
  triangle(leftPt.x - 6, leftPt.y - 6, leftPt.x + 6, leftPt.y - 6, leftPt.x, leftPt.y + 2);
}

function drawReadouts() {
  noStroke();
  fill(20);
  textAlign(LEFT, CENTER);
  textSize(15);
  text(
    'Effort Arm: ' + effortArmM.toFixed(2) + ' m    Load Arm: ' + loadArmM.toFixed(2) +
    ' m    Mechanical Advantage: ' + mechAdv.toFixed(2) + '×',
    40, 362
  );
  text(
    'Load Weight: ' + loadForce + ' N (fixed)    Applied Effort Force: ' + effortForce +
    ' N    Force Needed to Balance: ' + requiredEffort.toFixed(1) + ' N',
    40, 390
  );
}

function drawStatus() {
  let msg, col;
  const tol = 3;
  if (abs(netTorque) < tol) {
    msg = 'Balanced -- effort torque equals load torque.';
    col = [70, 150, 70];
  } else if (netTorque > 0) {
    msg = 'Load is lifting! Effort torque exceeds load torque.';
    col = [40, 110, 190];
  } else {
    msg = 'Load stays down -- increase effort force or move the fulcrum toward the load.';
    col = [190, 90, 40];
  }

  noStroke();
  fill(col[0], col[1], col[2], 30);
  rect(40, 412, 680, 32, 8);
  fill(col[0], col[1], col[2]);
  textAlign(CENTER, CENTER);
  textSize(16);
  text(msg, canvasW / 2, 428);
}

function drawControlLabels() {
  noStroke();
  fill(20);
  textAlign(LEFT, CENTER);
  textSize(14);
  text('Fulcrum Position: f = ' + f.toFixed(2), 40, 480);
  text('Effort Force: ' + effortForce + ' N', 400, 480);
}
</script>
</body>
</html>

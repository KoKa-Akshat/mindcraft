<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MindCraft · Scheduling Workflows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700;9..40,800&family=Fredoka:wght@550;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#143a2e; --ink2:#0c1207; --cream:#f6f3eb; --paper:#fffcf7;
  --lime:#c4f547; --line:rgba(20,58,46,.10); --muted:#6f6a61;
  --sand:#e8dfc8; --chalk:#1a2e24; --dot:rgba(28,26,23,.11);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif; color:var(--ink2);
  background:
    radial-gradient(900px 420px at 18% 12%, rgba(196,245,71,.10), transparent 60%),
    radial-gradient(800px 380px at 88% 78%, rgba(20,58,46,.05), transparent 55%),
    radial-gradient(var(--dot) 1.05px, transparent 1.15px),
    var(--cream);
  background-size:auto,auto,22px 22px,auto;
  overflow:hidden;
}
button,input,textarea{font:inherit}
button{border:0; background:none; cursor:pointer; color:inherit}
.hidden{display:none !important}

/* Desk chrome tuck simulation */
.deskShell{position:fixed; inset:0; display:flex; flex-direction:column}
.topTabs{
  display:flex; gap:8px; padding:10px 16px; align-items:center;
  transition: transform .38s cubic-bezier(.22,.9,.24,1), opacity .28s;
}
.topTabs .tab{
  padding:8px 14px; border-radius:999px; background:rgba(255,255,255,.75);
  border:1px solid var(--line); font-weight:700; font-size:13px; color:var(--ink);
}
.topTabs .tab.on{background:var(--ink); color:#f4efe2}
.dock{
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
  display:flex; gap:8px; padding:8px 10px; border-radius:999px;
  background:rgba(12,18,7,.82); z-index:30;
  transition: transform .4s cubic-bezier(.22,.9,.24,1), opacity .3s;
}
.dock .ico{
  width:40px; height:40px; border-radius:12px; background:#fff; color:var(--ink2);
  display:grid; place-items:center; font-weight:800; font-size:14px;
}
.dock .ico.wow{background:var(--lime); box-shadow:0 0 0 3px rgba(196,245,71,.25)}
.dock .ask{
  min-width:220px; border-radius:999px; background:rgba(32,34,38,.92);
  color:#f4efe2; padding:0 14px; display:flex; align-items:center; font-weight:600; font-size:13px;
}
body.wf-open .topTabs{transform:translateY(-120%); opacity:0; pointer-events:none}
body.wf-open .dock{transform:translate(-50%, 140%); opacity:0; pointer-events:none}

/* Overlay board */
.overlay{
  position:fixed; inset:0; z-index:40; display:grid; place-items:center;
  padding:28px 20px 36px;
  background:rgba(12,18,7,.18);
  backdrop-filter:blur(2px);
  animation:fadeIn .28s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.board{
  width:min(1120px, 96vw); height:min(720px, 90vh);
  background:var(--paper);
  border-radius:28px;
  border:1px solid rgba(20,58,46,.08);
  box-shadow:0 28px 70px rgba(12,18,7,.18), 0 0 0 1px rgba(255,255,255,.4) inset;
  display:flex; flex-direction:column; overflow:hidden;
  position:relative;
}
.boardHead{
  display:flex; align-items:center; gap:12px; padding:14px 18px;
  border-bottom:1px solid var(--line);
}
.boardHead .back{
  width:38px; height:38px; border-radius:12px; background:#fff;
  border:1px solid var(--line); font-weight:800;
}
.boardHead h1{
  font-family:'Fredoka',sans-serif; font-size:20px; font-weight:700; letter-spacing:-.02em;
}
.boardHead .chip{
  margin-left:auto; font-size:12px; font-weight:700; color:var(--ink);
  background:rgba(196,245,71,.35); border:1px solid rgba(20,58,46,.12);
  padding:7px 12px; border-radius:999px;
}
.boardBody{flex:1; overflow:auto; padding:28px 32px 40px}

/* Picker */
.pickerTitle{
  text-align:center; margin:8px 0 28px;
}
.pickerTitle h2{
  font-family:'Fredoka',sans-serif; font-size:clamp(28px, 4vw, 40px);
  font-weight:700; letter-spacing:-.03em; color:var(--ink2);
}
.pickerTitle p{margin-top:8px; color:var(--muted); font-weight:600; font-size:15px}
.cardRow{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:16px;
}
@media (max-width:980px){.cardRow{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.cardRow{grid-template-columns:1fr}}
.wfCard{
  background:#fff; border:1px solid var(--line); border-radius:18px;
  padding:0 0 16px; text-align:left; display:flex; flex-direction:column;
  min-height:340px; transition: transform .2s ease, box-shadow .2s;
  box-shadow:0 10px 28px rgba(20,58,46,.05);
}
.wfCard:hover{transform:translateY(-3px); box-shadow:0 16px 36px rgba(20,58,46,.10)}
.wfArt{
  height:120px; margin:14px 14px 0; border-radius:14px;
  display:grid; place-items:center; position:relative;
  background:
    linear-gradient(180deg, rgba(255,255,255,.35), transparent),
    repeating-linear-gradient(0deg, transparent, transparent 11px, rgba(20,58,46,.04) 11px, rgba(20,58,46,.04) 12px),
    repeating-linear-gradient(90deg, transparent, transparent 11px, rgba(20,58,46,.04) 11px, rgba(20,58,46,.04) 12px),
    #f3eee3;
}
.wfIcon{
  width:56px; height:56px; border-radius:14px; display:grid; place-items:center;
  font-size:22px; color:#fff; font-weight:800; box-shadow:0 8px 18px rgba(0,0,0,.12);
}
.wfCard .badges{position:absolute; top:10px; right:10px; display:flex; gap:4px}
.badge{
  font-size:10px; font-weight:800; padding:3px 7px; border-radius:6px; color:#fff;
}
.badge.pro{background:#5b9fd4}
.badge.stripe{background:#7c5cff}
.badge.home{background:var(--ink)}
.wfCard h3{font-family:'Fredoka',sans-serif; font-size:18px; margin:14px 16px 6px}
.wfCard p{font-size:13px; line-height:1.45; color:var(--muted); font-weight:600; margin:0 16px 14px; flex:1}
.wfActions{padding:0 16px; display:flex; flex-direction:column; gap:8px}
.btnCreate{
  width:100%; padding:11px 14px; border-radius:999px; font-weight:800; font-size:14px;
  background:#fff; border:1.5px solid var(--ink2); color:var(--ink2);
}
.btnCreate:hover{background:var(--ink2); color:#fff}
.btnAI{
  width:100%; padding:8px 12px; border-radius:999px; font-weight:700; font-size:12px;
  color:var(--ink); background:rgba(196,245,71,.28); border:1px solid rgba(20,58,46,.12);
}
.btnAI:hover{background:rgba(196,245,71,.5)}

/* Editor — Studio-like floating nodes */
.editor{
  display:grid; grid-template-columns:220px 1fr 240px; gap:16px; height:100%; min-height:520px;
}
@media (max-width:900px){.editor{grid-template-columns:1fr}}
.panel{
  background:#fff; border:1px solid var(--line); border-radius:18px; padding:14px;
  box-shadow:0 10px 28px rgba(20,58,46,.05);
}
.panel h4{
  font-family:'Fredoka',sans-serif; font-size:15px; margin-bottom:4px;
}
.panel .hint{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:12px}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:12px}
.field label{font-size:11px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
.field input,.field textarea{
  border:1px solid var(--line); border-radius:12px; padding:10px 12px;
  background:#faf8f3; font-weight:600; color:var(--ink2); outline:none;
}
.field textarea{min-height:72px; resize:vertical}
.slotList{display:flex; flex-direction:column; gap:8px}
.slot{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:10px 12px; border-radius:12px; background:#f7f4ec; border:1px solid var(--line);
  font-weight:700; font-size:13px;
}
.slot button{font-size:12px; font-weight:800; color:#a33; padding:4px 8px}
.centerStage{
  background:#fff; border:1px solid var(--line); border-radius:22px; overflow:hidden;
  display:flex; flex-direction:column; min-height:420px;
  box-shadow:0 14px 36px rgba(20,58,46,.07);
}
.stageHero{
  flex:1; min-height:240px; position:relative;
  background:
    linear-gradient(180deg, rgba(12,18,7,.15), rgba(12,18,7,.55)),
    url('../jesse_kitchen_desk_proto/img/kitchen-warm.jpg') center/cover;
  color:#fff; display:flex; flex-direction:column; justify-content:flex-end; padding:22px;
}
.stageHero h3{
  font-family:'Instrument Serif',Georgia,serif; font-size:34px; font-weight:400;
}
.stageHero p{font-weight:600; opacity:.9; margin-top:4px; max-width:36ch}
.stageBar{
  padding:12px 14px; display:flex; gap:8px; flex-wrap:wrap; border-top:1px solid var(--line);
  background:#fffcf7;
}
.limeBtn{
  background:var(--lime); color:var(--ink2); font-weight:800; padding:10px 16px;
  border-radius:999px; box-shadow:0 4px 0 rgba(20,58,46,.18);
}
.ghostBtn{
  background:#fff; border:1px solid var(--line); font-weight:700; padding:10px 14px; border-radius:999px;
}
.slideRail{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px}
.slideThumb{
  flex:none; width:88px; height:120px; border-radius:12px; border:1.5px dashed rgba(20,58,46,.25);
  background:#f3eee3; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-weight:800; font-size:12px; color:var(--ink); gap:4px;
}
.slideThumb.filled{
  border-style:solid; border-color:var(--ink); background:linear-gradient(160deg,#143a2e,#2a5644); color:#f4efe2;
  padding:8px; text-align:center;
}
.slideThumb.add{background:rgba(196,245,71,.35); border-color:rgba(20,58,46,.35)}
.aiBox{
  margin-top:12px; padding:12px; border-radius:14px; background:rgba(196,245,71,.18);
  border:1px solid rgba(20,58,46,.12);
}
.aiBox textarea{width:100%; border:0; background:transparent; outline:none; font-weight:600; min-height:56px; resize:none}
.aiBox .row{display:flex; justify-content:flex-end; margin-top:8px}

.toast{
  position:fixed; left:16px; bottom:16px; z-index:99;
  background:var(--chalk); color:#f4efe2; padding:10px 14px; border-radius:999px;
  font-weight:700; font-size:13px; box-shadow:0 10px 28px rgba(0,0,0,.2);
  animation:fadeIn .2s ease;
}
</style>
</head>
<body>
<div class="deskShell">
  <div class="topTabs" id="topTabs">
    <span class="tab on">Desk</span>
    <span class="tab">Notes</span>
    <span class="tab">Map</span>
    <span class="tab">Binder</span>
  </div>
</div>

<div class="dock" id="dock">
  <button class="ico" title="Record">●</button>
  <button class="ico" title="Mail">✉</button>
  <button class="ico" title="Calendar">▦</button>
  <button class="ico wow" id="wowBtn" title="Workflows">✦</button>
  <div class="ask">Ask MindCraft…</div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="board">
    <div class="boardHead">
      <button class="back" id="closeBtn" aria-label="Close">←</button>
      <h1 id="boardTitle">Select your workflow</h1>
      <span class="chip">Linked · Gmail · Calendar</span>
    </div>
    <div class="boardBody" id="boardBody"></div>
  </div>
</div>

<div id="toastWrap"></div>

<script>
const CALENDLY = 'https://calendly.com/joinmindcraft/30min';
const state = {
  open: false,
  view: 'picker', // picker | poll | signup | oneOne
  title: '',
  blurb: '',
  slots: [],
  slides: [],
  aiPrompt: '',
};

const CARDS = [
  {
    id: 'poll', tone: '#c4a484', icon: '◷',
    title: 'Group Poll',
    blurb: 'Find the time that works best for everyone. Pulls free/busy from Calendar, invites via Gmail.',
    badges: [['home','In-house']],
  },
  {
    id: 'signup', tone: '#1f6b4a', icon: '▥',
    title: 'Sign-up Sheet',
    blurb: 'Create sign-ups for workshops, office hours, or events — people claim the slot they want.',
    badges: [['home','In-house']],
  },
  {
    id: 'oneOne', tone: '#72c74a', icon: '◎',
    title: '1:1',
    blurb: 'Offer your open times. They pick one. Calendar blocks + Gmail confirmation — built here.',
    badges: [['home','In-house']],
  },
  {
    id: 'booking', tone: '#3b82c4', icon: '◉',
    title: 'Booking Page',
    blurb: 'Your Calendly booking page — share once, let clients book in a few clicks.',
    badges: [['pro','Calendly']],
  },
];

const DEFAULTS = {
  poll: {
    title: 'When works for study hall?',
    blurb: 'Pick every time you can make. We’ll lock the best overlap.',
    slots: ['Tue 4:00–4:30 PM', 'Tue 5:00–5:30 PM', 'Wed 3:30–4:00 PM', 'Thu 4:00–4:30 PM'],
  },
  signup: {
    title: 'Office hours sign-up',
    blurb: 'One seat per slot. Claim yours before it fills.',
    slots: ['Mon 12:00 · Seat 1', 'Mon 12:30 · Seat 1', 'Wed 4:00 · Seat 1', 'Wed 4:30 · Seat 1'],
  },
  oneOne: {
    title: 'Book a 1:1 with me',
    blurb: 'These are my open windows this week. Pick one — Calendar + Gmail handle the rest.',
    slots: ['Fri 10:00 AM', 'Fri 11:00 AM', 'Sat 2:00 PM', 'Sun 4:00 PM'],
  },
};

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

function openWorkflows(){
  state.open = true;
  state.view = 'picker';
  document.body.classList.add('wf-open');
  document.getElementById('overlay').classList.remove('hidden');
  render();
  toast('Workflows open · dock tucked');
}

function closeWorkflows(){
  state.open = false;
  document.body.classList.remove('wf-open');
  document.getElementById('overlay').classList.add('hidden');
  toast('Back to desk');
}

function startInHouse(id){
  const d = DEFAULTS[id];
  state.view = id;
  state.title = d.title;
  state.blurb = d.blurb;
  state.slots = [...d.slots];
  state.slides = [{ id: 1, label: 'Cover', body: d.title }];
  state.aiPrompt = '';
  render();
}

function openBooking(){
  window.open(CALENDLY, '_blank', 'noopener');
  toast('Opening Calendly booking…');
}

function aiCustomizeCard(id){
  if (id === 'booking') {
    toast('Calendly page — customize in Calendly settings');
    return;
  }
  const prompts = {
    poll: 'Make this a Friday ACT review poll for 6 friends',
    signup: 'Workshop: Desmos graphing lab, 8 seats',
    oneOne: 'College essay check-ins, 25 min each',
  };
  startInHouse(id);
  state.aiPrompt = prompts[id];
  runAI();
}

function runAI(){
  const p = (state.aiPrompt || '').trim().toLowerCase();
  if (!p) { toast('Type what you want AI to shape'); return; }
  if (p.includes('act') || p.includes('friday')) {
    state.title = 'Friday ACT review — when works?';
    state.blurb = 'Quick group poll. Calendar checks free/busy; Gmail sends the invite.';
    state.slots = ['Fri 4:00 PM', 'Fri 5:00 PM', 'Fri 6:00 PM', 'Sat 11:00 AM'];
  } else if (p.includes('desmos') || p.includes('workshop') || p.includes('seat')) {
    state.title = 'Desmos graphing lab';
    state.blurb = '8 seats. Claim one — reminder hits Gmail night before.';
    state.slots = Array.from({length:8}, (_,i) => `Wed 3:00 · Seat ${i+1}`);
  } else if (p.includes('essay') || p.includes('college') || p.includes('25')) {
    state.title = 'College essay 1:1 (25 min)';
    state.blurb = 'Pick a window. We block GCal and send a Meet note.';
    state.slots = ['Mon 5:00 PM', 'Tue 5:00 PM', 'Thu 4:30 PM', 'Sun 2:00 PM'];
  } else {
    state.title = state.title.replace(/\?|$/, '') + ' · AI pass';
    state.blurb = 'AI shaped this from your note. Edit slots, then share.';
  }
  if (state.slides[0]) state.slides[0].body = state.title;
  toast('AI customize applied (local draft)');
  render();
}

function addSlide(){
  const n = state.slides.length + 1;
  state.slides.push({ id: n, label: `Slide ${n}`, body: n === 2 ? 'How it works' : `Beat ${n}` });
  toast('Slide added');
  render();
}

function addSlot(){
  const label = state.view === 'signup'
    ? `New seat · ${state.slots.length + 1}`
    : 'New time window';
  state.slots.push(label);
  render();
}

function renderPicker(){
  document.getElementById('boardTitle').textContent = 'Select your workflow';
  const row = CARDS.map(c => `
    <article class="wfCard" data-id="${c.id}">
      <div class="wfArt">
        <div class="badges">${c.badges.map(([k,t]) => `<span class="badge ${k}">${t}</span>`).join('')}</div>
        <div class="wfIcon" style="background:${c.tone}">${c.icon}</div>
      </div>
      <h3>${c.title}</h3>
      <p>${c.blurb}</p>
      <div class="wfActions">
        <button class="btnCreate" data-create="${c.id}">Create</button>
        <button class="btnAI" data-ai="${c.id}">AI customize</button>
      </div>
    </article>
  `).join('');
  document.getElementById('boardBody').innerHTML = `
    <div class="pickerTitle">
      <h2>Select your workflow</h2>
      <p>In-house for poll · sign-up · 1:1. Booking stays on Calendly. Gmail + Calendar already linked.</p>
    </div>
    <div class="cardRow">${row}</div>
  `;
  document.querySelectorAll('[data-create]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-create');
      if (id === 'booking') openBooking();
      else startInHouse(id);
    };
  });
  document.querySelectorAll('[data-ai]').forEach(btn => {
    btn.onclick = () => aiCustomizeCard(btn.getAttribute('data-ai'));
  });
}

function renderEditor(){
  const labels = { poll: 'Group Poll', signup: 'Sign-up Sheet', oneOne: '1:1' };
  document.getElementById('boardTitle').textContent = labels[state.view] || 'Workflow';
  const slots = state.slots.map((s,i) => `
    <div class="slot">
      <span>${s}</span>
      <button data-rm="${i}">Remove</button>
    </div>
  `).join('');
  const slides = state.slides.map(s => `
    <div class="slideThumb filled"><strong>${s.label}</strong><span style="font-size:11px;font-weight:600;opacity:.85">${s.body}</span></div>
  `).join('') + `<button class="slideThumb add" id="addSlide">+ Add slide</button>`;

  document.getElementById('boardBody').innerHTML = `
    <div class="editor">
      <aside class="panel">
        <h4>Setup</h4>
        <p class="hint">Same board language as Studio Create — edit, then share.</p>
        <div class="field">
          <label>Title</label>
          <input id="fTitle" value="${escapeAttr(state.title)}">
        </div>
        <div class="field">
          <label>Note</label>
          <textarea id="fBlurb">${escapeHtml(state.blurb)}</textarea>
        </div>
        <button class="ghostBtn" id="addSlot" style="width:100%">+ Add time / seat</button>
        <div class="aiBox">
          <textarea id="aiPrompt" placeholder="AI customize… e.g. Friday ACT review for 6 friends">${escapeHtml(state.aiPrompt)}</textarea>
          <div class="row"><button class="limeBtn" id="aiGo" style="padding:8px 14px;font-size:12px">AI customize</button></div>
        </div>
      </aside>
      <section class="centerStage">
        <div class="stageHero">
          <h3 id="heroTitle">${escapeHtml(state.title)}</h3>
          <p id="heroBlurb">${escapeHtml(state.blurb)}</p>
        </div>
        <div class="stageBar">
          <button class="limeBtn" id="shareBtn">Share link →</button>
          <button class="ghostBtn" id="mailBtn">Send via Gmail</button>
          <button class="ghostBtn" id="calBtn">Block on Calendar</button>
          <button class="ghostBtn" id="backPicker">All workflows</button>
        </div>
      </section>
      <aside class="panel">
        <h4>Slots</h4>
        <p class="hint">From your Calendar free windows (prototype seeds).</p>
        <div class="slotList">${slots}</div>
        <h4 style="margin-top:18px">Slideshow</h4>
        <p class="hint">Mute-friendly share deck · AI can rewrite under Create too.</p>
        <div class="slideRail">${slides}</div>
      </aside>
    </div>
  `;

  const sync = () => {
    state.title = document.getElementById('fTitle').value;
    state.blurb = document.getElementById('fBlurb').value;
    document.getElementById('heroTitle').textContent = state.title;
    document.getElementById('heroBlurb').textContent = state.blurb;
    if (state.slides[0]) state.slides[0].body = state.title;
  };
  document.getElementById('fTitle').oninput = sync;
  document.getElementById('fBlurb').oninput = sync;
  document.getElementById('addSlot').onclick = addSlot;
  document.getElementById('addSlide').onclick = addSlide;
  document.getElementById('aiGo').onclick = () => {
    state.aiPrompt = document.getElementById('aiPrompt').value;
    runAI();
  };
  document.getElementById('shareBtn').onclick = () => toast('Share link copied (prototype)');
  document.getElementById('mailBtn').onclick = () => toast('Gmail draft queued · desk mail');
  document.getElementById('calBtn').onclick = () => toast('Calendar holds placed (prototype)');
  document.getElementById('backPicker').onclick = () => { state.view = 'picker'; render(); };
  document.querySelectorAll('[data-rm]').forEach(btn => {
    btn.onclick = () => {
      state.slots.splice(+btn.getAttribute('data-rm'), 1);
      render();
    };
  });
}

function render(){
  if (state.view === 'picker') renderPicker();
  else renderEditor();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s).replace(/`/g,''); }

document.getElementById('wowBtn').onclick = openWorkflows;
document.getElementById('closeBtn').onclick = () => {
  if (state.view !== 'picker') { state.view = 'picker'; render(); return; }

      <path d="M40 -10 Q92 -34 132 -70" fill="none" stroke="#33230f" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
      <circle cx="136" cy="-73" r="9" fill="#e0b083" stroke="#33230f" stroke-width="3"/>
    
    
    <path d="M-40 -10 Q-70 30 -66 78" fill="none" stroke="#5a3a2b" stroke-width="16" stroke-linecap="round"/>

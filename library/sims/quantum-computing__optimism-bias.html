    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognitive Bias Network in QC Investment</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: aliceblue;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

#network {
    width: 100vw;
    height: 100vh;
    position: absolute;
    top: 0;
    left: 0;
}

#title {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 18px;
    font-weight: bold;
    color: #333;
    background: rgba(240, 248, 255, 0.9);
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
    white-space: nowrap;
}

#legend {
    position: absolute;
    top: 55px;
    left: 10px;
    z-index: 10;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.6;
    min-width: 140px;
}

.legend-title {
    font-weight: bold;
    margin-bottom: 4px;
    font-size: 14px;
    color: #333;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
}

.legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
}

.legend-instructions {
    margin-top: 8px;
    font-size: 11px;
    color: #666;
    border-top: 1px solid #ddd;
    padding-top: 6px;
    line-height: 1.4;
}

#right-panel {
    position: absolute;
    top: 55px;
    right: 10px;
    z-index: 10;
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 12px 16px;
    width: 240px;
    font-size: 13px;
    line-height: 1.5;
    max-height: calc(100vh - 80px);
    overflow-y: auto;
}

#panel-title {
    font-weight: bold;
    font-size: 15px;
    color: #333;
    margin-bottom: 6px;
}

#panel-body {
    color: #555;
}

#panel-body .connection-list {
    margin-top: 8px;
    padding-left: 0;
    list-style: none;
}

#panel-body .connection-list li {
    padding: 3px 0;
    border-bottom: 1px solid #eee;
    font-size: 12px;
}

#panel-body .connection-list li:last-child {
    border-bottom: none;
}

.connection-arrow {
    color: #999;
    font-weight: bold;
}
</style>
</head>
<body>
    <div id="title">Cognitive Bias Network in QC Investment</div>

    <div id="legend">
        <div class="legend-title">Categories</div>
        <div class="legend-item">
            <span class="legend-dot" style="background: #4285F4;"></span> Perception
        </div>
        <div class="legend-item">
            <span class="legend-dot" style="background: #34A853;"></span> Social
        </div>
        <div class="legend-item">
            <span class="legend-dot" style="background: #FF7043;"></span> Cognitive
        </div>
        <div class="legend-item">
            <span class="legend-dot" style="background: #EA4335;"></span> Economic
        </div>
        <div class="legend-instructions">Click a node to highlight its connections.<br>Click empty space to reset.</div>
    </div>

    <div id="right-panel">
        <div id="panel-title">Select a Bias</div>
        <div id="panel-body">Click on any bias node to see a QC-specific example and its reinforcement connections.</div>
    </div>

    <div id="network"></div>

    <script>// Cognitive Bias Network in QC Investment
// vis-network interactive graph

let network = null;
let graphData = null;
let allNodes = null;
let allEdges = null;

fetch('data.json')
    .then(response => response.json())
    .then(data => {
        graphData = data;
        initNetwork(data);
    })
    .catch(err => console.error('Failed to load data.json:', err));

function initNetwork(data) {
    const container = document.getElementById('network');
    const categoryColors = data.categories;

    // Build vis-network nodes
    const nodeArray = data.nodes.map(n => {
        const cat = categoryColors[n.category];
        return {
            id: n.id,
            label: n.label,
            title: n.title,
            x: n.x * 1.8,
            y: n.y * 1.4,
            fixed: { x: true, y: true },
            color: {
                background: cat.color,
                border: darkenColor(cat.color, 0.3),
                highlight: {
                    background: lightenColor(cat.color, 0.2),
                    border: darkenColor(cat.color, 0.4)
                },
                hover: {
                    background: lightenColor(cat.color, 0.15),
                    border: darkenColor(cat.color, 0.35)
                }
            },
            font: {
                color: '#fff',
                size: 13,
                face: 'Arial',
                strokeWidth: 2,
                strokeColor: 'rgba(0,0,0,0.5)',
                multi: true
            },
            shape: 'ellipse',
            size: 30,
            borderWidth: 2,
            shadow: {
                enabled: true,
                color: 'rgba(0,0,0,0.15)',
                size: 6,
                x: 2,
                y: 2
            },
            // Store custom data
            category: n.category,
            example: n.example
        };
    });

    // Build vis-network edges
    const edgeArray = data.edges.map((e, i) => ({
        id: i,
        from: e.from,
        to: e.to,
        label: '',
        title: e.title,
        arrows: { to: { enabled: true, scaleFactor: 0.7 } },
        color: {
            color: '#999',
            highlight: '#3F51B5',
            hover: '#666'
        },
        width: 1.5,
        hoverWidth: 0.5,
        selectionWidth: 1,
        smooth: {
            type: 'curvedCW',
            roundness: 0.15
        },
        font: {
            size: 10,
            color: '#555',
            strokeWidth: 2,
            strokeColor: '#fff',
            align: 'middle',
            multi: true
        },
        edgeLabel: e.label
    }));

    allNodes = new vis.DataSet(nodeArray);
    allEdges = new vis.DataSet(edgeArray);

    const options = {
        interaction: {
            zoomView: false,
            dragView: false,
            dragNodes: false,
            hover: true,
            tooltipDelay: 200
        },
        physics: {
            enabled: false
        },
        nodes: {
            chosen: true
        },
        edges: {
            chosen: true
        }
    };

    network = new vis.Network(container, { nodes: allNodes, edges: allEdges }, options);

    // Click handler: highlight connected nodes
    network.on('click', function(params) {
        if (params.nodes.length > 0) {
            highlightNode(params.nodes[0]);
        } else {
            resetHighlight();
            resetPanel();
        }
    });

    // Hover handler: show edge labels on hover
    network.on('hoverEdge', function(params) {
        const edge = allEdges.get(params.edge);
        if (edge && edge.edgeLabel) {
            allEdges.update({ id: edge.id, label: edge.edgeLabel });
        }
    });

    network.on('blurEdge', function(params) {
        allEdges.update({ id: params.edge, label: '' });
    });
}

function highlightNode(nodeId) {
    const node = allNodes.get(nodeId);
    if (!node) return;

    // Find connected edges and nodes
    const connectedEdges = allEdges.get().filter(e => e.from === nodeId || e.to === nodeId);
    const connectedNodeIds = new Set([nodeId]);
    connectedEdges.forEach(e => {
        connectedNodeIds.add(e.from);
        connectedNodeIds.add(e.to);
    });

    // Dim unconnected nodes
    const nodeUpdates = allNodes.get().map(n => {
        if (connectedNodeIds.has(n.id)) {
            return { id: n.id, opacity: 1.0 };
        } else {
            return { id: n.id, opacity: 0.15 };
        }
    });
    allNodes.update(nodeUpdates);

    // Highlight connected edges, dim others, show labels on connected
    const edgeUpdates = allEdges.get().map(e => {
        const isConnected = e.from === nodeId || e.to === nodeId;
        return {
            id: e.id,
            color: isConnected
                ? { color: '#3F51B5', highlight: '#3F51B5' }
                : { color: 'rgba(153,153,153,0.15)', highlight: '#3F51B5' },
            width: isConnected ? 3 : 0.5,
            label: isConnected ? e.edgeLabel : ''
        };
    });
    allEdges.update(edgeUpdates);

    // Update right panel
    updatePanel(nodeId, connectedEdges);
}

function resetHighlight() {
    const nodeUpdates = allNodes.get().map(n => ({
        id: n.id,
        opacity: 1.0
    }));
    allNodes.update(nodeUpdates);

    const edgeUpdates = allEdges.get().map(e => ({
        id: e.id,
        color: { color: '#999', highlight: '#3F51B5', hover: '#666' },
        width: 1.5,
        label: ''
    }));
    allEdges.update(edgeUpdates);
}

function updatePanel(nodeId, connectedEdges) {
    const node = allNodes.get(nodeId);
    const panelTitle = document.getElementById('panel-title');
    const panelBody = document.getElementById('panel-body');

    const catLabel = graphData.categories[node.category].label;

    let connectionsHtml = '<ul class="connection-list">';
    connectedEdges.forEach(e => {
        const otherNodeId = e.from === nodeId ? e.to : e.from;
        const otherNode = allNodes.get(otherNodeId);
        const direction = e.from === nodeId ? '\u2192' : '\u2190';
        connectionsHtml += `<li><span class="connection-arrow">${direction}</span> ${otherNode.label.replace('\n', ' ')}: ${e.title}</li>`;
    });
    connectionsHtml += '</ul>';

    panelTitle.textContent = node.label.replace('\n', ' ');
    panelBody.innerHTML = `
        <p><strong>Category:</strong> ${catLabel}</p>
        <p style="margin-top:6px;">${node.title}</p>
        <p style="margin-top:8px;font-style:italic;color:#444;">"${node.example}"</p>
        <p style="margin-top:10px;font-weight:bold;font-size:12px;">Connections (${connectedEdges.length}):</p>
        ${connectionsHtml}
    `;
}

function resetPanel() {
    document.getElementById('panel-title').textContent = 'Select a Bias';
    document.getElementById('panel-body').textContent = 'Click on any bias node to see a QC-specific example and its reinforcement connections.';
}

// Color utility functions
function darkenColor(hex, amount) {
    const rgb = hexToRgb(hex);
    return `rgb(${Math.round(rgb.r * (1 - amount))}, ${Math.round(rgb.g * (1 - amount))}, ${Math.round(rgb.b * (1 - amount))})`;
}

function lightenColor(hex, amount) {
    const rgb = hexToRgb(hex);
    return `rgb(${Math.min(255, Math.round(rgb.r + (255 - rgb.r) * amount))}, ${Math.min(255, Math.round(rgb.g + (255 - rgb.g) * amount))}, ${Math.min(255, Math.round(rgb.b + (255 - rgb.b) * amount))})`;
}

function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
    } : { r: 0, g: 0, b: 0 };
}
</script>
</body>

<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3e2"/>
      <stop offset="0.62" stop-color="#eddab3"/>
      <stop offset="1" stop-color="#e2c793"/>
    </linearGradient>
    <radialGradient id="vign" cx="50%" cy="42%" r="70%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2410" stop-opacity="0.16"/>
    </radialGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#33230f"/>
    </marker>
  </defs><rect x="0" y="0" width="800" height="800" fill="url(#bg)"/>
    <line x1="0" y1="640" x2="800" y2="640" stroke="#33230f" stroke-width="3" opacity="0.28"/>
    <!-- Newton's orchard: one apple mid-fall, and a curve frozen at the single instant its tangent touches -->
    <g transform="translate(220 560)">
      <path d="M0 0 Q-10 -160 20 -260" fill="none" stroke="#33230f" stroke-width="14" stroke-linecap="round"/>
      <circle cx="24" cy="-280" r="70" fill="#e2c793" stroke="#33230f" stroke-width="4" opacity="0.85"/>
      <circle cx="40" cy="-140" r="16" fill="#c99a3a" stroke="#33230f" stroke-width="3"/>
      <line x1="40" y1="-124" x2="34" y2="-40" stroke="#33230f" stroke-width="2" stroke-dasharray="3 8" opacity="0.5"/>
    </g>
    <g transform="translate(430 620)">
      <path d="M0 0 h320" stroke="#33230f" stroke-width="3" opacity="0.4"/>
      <path d="M0 0 v-260" stroke="#33230f" stroke-width="3" opacity="0.4"/>
      <path d="M10 -10 Q140 -20 220 -220" fill="none" stroke="#1d3a8a" stroke-width="7" stroke-linecap="round"/>
      <line x1="120" y1="-150" x2="260" y2="-230" stroke="#c99a3a" stroke-width="5" stroke-linecap="round"/>
      <circle cx="176" cy="-186" r="9" fill="#33230f"/>
    </g>
    <g transform="translate(560 610) scale(0.9 0.9)">
    <!-- robe -->
    <path d="M-70 190 Q-90 60 -46 -30 Q0 -58 46 -30 Q90 60 70 190 Z" fill="#1d3a8a" stroke="#33230f" stroke-width="5"/>
    <path d="M-46 -30 Q0 10 46 -30" fill="none" stroke="#33230f" stroke-width="3.5" opacity="0.6"/>
    <path d="M-20 190 L-14 40 M20 190 L14 40" stroke="#33230f" stroke-width="2.5" opacity="0.35"/>
    <!-- arm -->
    <path d="M40 -10 Q92 -34 132 -70" fill="none" stroke="#1d3a8a" stroke-width="16" stroke-linecap="round"/>
      <path d="M40 -10 Q92 -34 132 -70" fill="none" stroke="#33230f" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
      <circle cx="136" cy="-73" r="9" fill="#e0b083" stroke="#33230f" stroke-width="3"/>
    
    
    <path d="M-40 -10 Q-70 30 -66 78" fill="none" stroke="#1d3a8a" stroke-width="16" stroke-linecap="round"/>
    <path d="M-40 -10 Q-70 30 -66 78" fill="none" stroke="#33230f" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <circle cx="-67" cy="82" r="9" fill="#e0b083" stroke="#33230f" stroke-width="3"/>
    <!-- head -->
    <circle cx="0" cy="-72" r="44" fill="#e0b083" stroke="#33230f" stroke-width="5"/>
    <path d="M-40 -84 Q0 -122 40 -84 Q42 -104 0 -116 Q-42 -104 -40 -84 Z" fill="#3a2717" stroke="#33230f" stroke-width="4"/>
    <path d="M-16 -68 q6 -8 12 0 M8 -68 q6 -8 12 0" stroke="#33230f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M-6 -50 q6 4 12 0" stroke="#33230f" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    
    
    
  </g>
  <rect x="0" y="0" width="800" height="800" fill="url(#vign)"/></svg>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>full concept graph</title>
<style>
  :root{--ink:#e8efe4;--dim:#8ea09a;--field:#080e14;--lime:#c4f547;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--field);color:var(--ink);font:12px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
  #graph{position:absolute;inset:0}
  .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);z-index:3}

  /* Overlays are read-only chrome: never eat pointer events from the canvas. */
  .panel{position:absolute;z-index:2;pointer-events:none;background:rgba(8,14,20,.72);
         border:1px solid rgba(232,239,228,.10);border-radius:12px;padding:10px 12px;
         backdrop-filter:blur(6px)}

  #legend{left:14px;bottom:14px;max-width:250px}
  #legend h2{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:7px}
  .subjects{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
  .sub{display:flex;align-items:center;gap:6px;font-size:10.5px;color:rgba(232,239,228,.78);white-space:nowrap;overflow:hidden}
  .swatch{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
  .sub em{font-style:normal;color:var(--dim);font-size:9.5px}
  .rule{height:1px;background:rgba(232,239,228,.10);margin:9px 0}
  .key{display:flex;align-items:center;gap:7px;font-size:10.5px;color:rgba(232,239,228,.72);margin-bottom:3px}
  .dot{border-radius:50%;flex:0 0 auto;background:var(--lime)}
  #totals{color:var(--dim);font-size:10px;margin-top:8px;line-height:1.5}

  #focus{left:50%;top:14px;transform:translateX(-50%);max-width:min(560px,86vw);text-align:center;display:none}
  #focus .name{font-size:14px;font-weight:600;color:#fff}
  #focus .meta{font-size:10.5px;color:var(--dim);margin-top:3px}
  #focus .warn{color:#f2b84b}
</style>
</head>
<body>
  <div class="wait" id="wait">Loading the concept graph</div>
  <div id="graph"></div>
  <div class="panel" id="focus"><div class="name"></div><div class="meta"></div></div>
  <div class="panel" id="legend" hidden>
    <div id="subjectBlock">
      <h2>Subjects</h2>
      <div class="subjects" id="subjects"></div>
      <div class="rule"></div>
    </div>
    <div class="key"><span class="dot" style="width:9px;height:9px"></span> lesson + sim</div>
    <div class="key"><span class="dot" style="width:6px;height:6px"></span> lesson only</div>
    <div class="key"><span class="dot" style="width:4px;height:4px;background:#3d4a52"></span> gap, no content yet</div>
    <div class="key" id="studiedKey" hidden><span class="dot" style="width:10px;height:10px;background:#f2b84b"></span> <span id="studiedCount"></span></div>
    <div id="totals"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
  <script>
  // Generalized concept-graph viewer. Reads whatever full-concept-graph.json
  // currently holds (written by scripts/export_concept_graph.py) so a content
  // round that adds subjects or lessons shows up on reload with no code edit.
  // Node ids come in two shapes and both are treated as opaque strings:
  // bare act-math ids ("circles_geometry") and subject-prefixed ids
  // ("biology::phylogenetics").
  //
  // postMessage protocol (unchanged from the act-math viewer this replaces):
  //   { type: 'highlight', nodeId, neighborIds }
  //   { type: 'clear' }
  //   { type: 'studied', ids: [conceptId, ...] }
  //
  // 'studied' is the per-node study history the learn page keeps in
  // localStorage. It is deliberately encoded the same way coverage already is,
  // through color and size rather than extra geometry, because that is this
  // viewer's existing visual language and because 4118 spheres cannot afford a
  // per-node mesh. Studied nodes keep a trace of their subject hue so the
  // marker reads as "this one, which you have seen" rather than a new category.

  const FIELD = [8, 14, 20];          // background, for fading gap nodes into it
  const FOCUS_COLOR = '#ffffff';
  const STUDIED_COLOR = '#f2b84b';    // warm, and used by nothing else on screen
  const DIM_COLOR = '#26333c';        // everything outside a highlight
  const LINK_BASE = 'rgba(150,175,185,0.09)';
  const LINK_CROSS = 'rgba(196,245,71,0.16)';   // cross_subject bridges read warmer
  const LINK_ACTIVE = 'rgba(255,255,255,0.55)';
  const LINK_MUTED = 'rgba(120,140,150,0.03)';

  // Volume values, not radii: force-graph draws radius as nodeRelSize * cbrt(val),
  // so these read as roughly 1x / 1.5x / 2.1x wide.
  const VAL_GAP = 0.45, VAL_LESSON = 1.5, VAL_SIM = 4.2;

  const el = document.getElementById('graph');
  const wait = document.getElementById('wait');
  const focusBox = document.getElementById('focus');
  const legend = document.getElementById('legend');

  let graph = null;
  let nodesById = new Map();
  let adjacency = new Map();
  let subjectById = new Map();
  let studied = new Set();

  function hex2rgb(h) {
    const v = parseInt(h.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }
  function rgb2hex(c) {
    return '#' + c.map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, '0')).join('');
  }
  function mix(hex, target, t) {
    const a = hex2rgb(hex);
    return rgb2hex(a.map((v, i) => v + (target[i] - v) * t));
  }

  // Base color encodes coverage on top of subject hue, so the graph itself
  // shows where content exists and where the gaps are:
  //   sim    -> subject color lifted toward white (brightest, biggest)
  //   lesson -> the subject color itself
  //   gap    -> faded most of the way into the background
  function baseColor(n) {
    const c = subjectById.get(n.subject)?.color || '#8aa4b0';
    // Study history wins over coverage: what you have already read is the more
    // useful thing to see at a glance when you come back to the graph.
    if (studied.has(n.id)) return mix(c, hex2rgb(STUDIED_COLOR), 0.72);
    if (n.hasSim) return mix(c, [255, 255, 255], 0.34);
    if (n.hasLesson) return c;
    return mix(c, FIELD, 0.72);
  }
  function nodeVal(n) {
    const base = n.hasSim ? VAL_SIM : n.hasLesson ? VAL_LESSON : VAL_GAP;
    return studied.has(n.id) ? Math.max(base, VAL_SIM) * 1.35 : base;
  }
  function coverageWord(n) {
    const cover = n.hasSim ? 'lesson + sim' : n.hasLesson ? 'lesson, no sim yet' : 'no content yet';
    return studied.has(n.id) ? cover + ' · studied' : cover;
  }

  // Re-run the accessors so a studied-set change repaints without a reload.
  function refreshNodeStyling() {
    if (!graph) return;
    graph.nodeColor(baseColor).nodeVal(nodeVal);
  }

  function renderStudiedKey() {
    const row = document.getElementById('studiedKey');
    const label = document.getElementById('studiedCount');
    if (!row || !label) return;
    row.hidden = studied.size === 0;
    label.textContent = studied.size === 1 ? 'studied (1 concept)' : `studied (${studied.size} concepts)`;
  }

  // Deterministic per-id jitter, so the layout starts the same way every reload.
  function seeded(id) {
    let h = 2166136261;
    for (let i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
    return () => { h += 0x6d2b79f5; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // Seed each subject onto its own point of a Fibonacci sphere. At this node
  // count a cold random start settles into a hairball; starting pre-clustered
  // by subject settles fast and stays readable.
  function seedPositions(nodes, subjects) {
    const S = subjects.length || 1;
    const R = 620 + S * 26;
    const centers = new Map();
    subjects.forEach((s, i) => {
      const y = 1 - (i / Math.max(1, S - 1)) * 2;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const theta = i * Math.PI * (3 - Math.sqrt(5));
      centers.set(s.id, [Math.cos(theta) * r * R, y * R, Math.sin(theta) * r * R]);
    });
    for (const n of nodes) {
      const c = centers.get(n.subject) || [0, 0, 0];
      const rnd = seeded(n.id);
      const spread = 150;
      n.x = c[0] + (rnd() - 0.5) * spread;
      n.y = c[1] + (rnd() - 0.5) * spread;
      n.z = c[2] + (rnd() - 0.5) * spread;
    }
  }

  const params = new URLSearchParams(location.search);
  const hideSubjects = params.has('hideSubjects');
  const hideLegend = params.has('hideLegend');
  if (hideSubjects) document.getElementById('subjectBlock').hidden = true;

  function renderLegend(data) {
    if (!hideSubjects) {
      const box = document.getElementById('subjects');
      box.innerHTML = '';
      for (const s of data.subjects) {
        const row = document.createElement('div');
        row.className = 'sub';
        row.title = `${s.title} — ${s.nodeCount} concepts, ${s.withLesson} with a lesson, ${s.withSim} with a sim`;
        row.innerHTML = `<span class="swatch" style="background:${s.color}"></span>` +
          `<span>${s.id} <em>${s.nodeCount}</em></span>`;
        box.appendChild(row);
      }
    }
    const c = data.counts || {};
    document.getElementById('totals').textContent =
      `${c.nodes} concepts, ${c.edges} links, ${c.subjects} subjects. ` +
      `${c.withLesson} have a lesson, ${c.withSim} have a sim.`;
    legend.hidden = hideLegend;
  }

  function showFocus(node, missingId) {
    if (missingId) {
      focusBox.querySelector('.name').textContent = 'Concept not in this graph';
      focusBox.querySelector('.meta').innerHTML =
        `<span class="warn">${missingId}</span> was resolved but is not in full-concept-graph.json. Re-run scripts/export_concept_graph.py.`;
      focusBox.style.display = 'block';
      return;
    }
    const s = subjectById.get(node.subject);
    focusBox.querySelector('.name').textContent = node.name;
    focusBox.querySelector('.meta').textContent =
      `${s ? s.title : node.subject} · ${node.level.replace(/_/g, ' ')} · ${coverageWord(node)}`;
    focusBox.style.display = 'block';
  }

  function flyTo(node) {
    if (node.x == null) return;
    const dist = Math.hypot(node.x, node.y, node.z) || 1;
    const ratio = 1 + 170 / dist;
    graph.cameraPosition({ x: node.x * ratio, y: node.y * ratio, z: node.z * ratio }, node, 1300);
  }

  function applyHighlight(nodeId, extraNeighbors) {
    const active = new Set([nodeId]);
    for (const id of adjacency.get(nodeId) || []) active.add(id);
    for (const id of extraNeighbors || []) active.add(id);
    graph
      .nodeColor(n => n.id === nodeId ? FOCUS_COLOR : active.has(n.id) ? baseColor(n) : DIM_COLOR)
      .nodeVal(n => n.id === nodeId ? Math.max(VAL_SIM, nodeVal(n)) * 2.4 : active.has(n.id) ? Math.max(VAL_LESSON, nodeVal(n)) : VAL_GAP)
      .linkColor(l => {
        const a = typeof l.source === 'object' ? l.source.id : l.source;
        const b = typeof l.target === 'object' ? l.target.id : l.target;
        return (a === nodeId || b === nodeId) ? LINK_ACTIVE
          : (active.has(a) && active.has(b)) ? LINK_CROSS : LINK_MUTED;
      });
  }

  function clearHighlight() {
    graph
      .nodeColor(baseColor)
      .nodeVal(nodeVal)
      .linkColor(l => l.relation === 'cross_subject' ? LINK_CROSS : LINK_BASE);
    focusBox.style.display = 'none';
  }

  fetch('/full-concept-graph.json')
    .then(r => r.json())
    .then(data => {
      const nodes = data.nodes || [];
      const links = (data.edges || []).map(e => ({ source: e.source, target: e.target, relation: e.relation, weight: e.weight }));
      subjectById = new Map((data.subjects || []).map(s => [s.id, s]));
      nodesById = new Map(nodes.map(n => [n.id, n]));
      adjacency = new Map();
      for (const l of links) {
        if (!adjacency.has(l.source)) adjacency.set(l.source, new Set());
        if (!adjacency.has(l.target)) adjacency.set(l.target, new Set());
        adjacency.get(l.source).add(l.target);
        adjacency.get(l.target).add(l.source);
      }
      seedPositions(nodes, data.subjects || []);
      renderLegend(data);
      wait.remove();

      graph = ForceGraph3D()(el)
        .graphData({ nodes, links })
        .backgroundColor('#080e14')
        .nodeLabel(n => {
          const s = subjectById.get(n.subject);
          return `<div style="font:12px Inter,system-ui,sans-serif;color:#e8efe4;background:rgba(8,14,20,.92);border:1px solid rgba(232,239,228,.14);border-radius:8px;padding:6px 9px;max-width:260px">
            <b>${n.name}</b><br><span style="color:#8ea09a">${s ? s.title : n.subject} · ${coverageWord(n)}</span></div>`;
        })
        .nodeColor(baseColor)
        .nodeVal(nodeVal)
        .nodeRelSize(2.1)
        .nodeResolution(6)          // fewer triangles per sphere: thousands of them
        .nodeOpacity(0.92)
        .linkColor(l => l.relation === 'cross_subject' ? LINK_CROSS : LINK_BASE)
        .linkOpacity(1)             // alpha lives in the rgba colors above
        .linkWidth(0)
        .showNavInfo(false)
        .warmupTicks(0)
        .cooldownTime(11000)
        .onNodeClick(n => { applyHighlight(n.id, []); showFocus(n); flyTo(n); });

      graph.d3Force('charge').strength(-58).distanceMax(520);
      graph.d3Force('link').distance(l => 26 + (1 - (l.weight || 0.5)) * 22);

      const controls = graph.controls();
      controls.autoRotate = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      controls.autoRotateSpeed = 0.35;
      controls.addEventListener('start', () => { controls.autoRotate = false; });
    })
    .catch(() => {
      wait.textContent = 'full-concept-graph.json not found. Run scripts/export_concept_graph.py.';
    });

  window.addEventListener('message', ev => {
    if (!ev.data) return;
    // Handled before the graph-ready guard: the learn page posts study history
    // as soon as its iframe fires load, which can beat the graph fetch. The set
    // is kept either way and the accessors pick it up when they first run.
    if (ev.data.type === 'studied') {
      studied = new Set(ev.data.ids || []);
      refreshNodeStyling();
      renderStudiedKey();
      return;
    }
    if (!graph) return;
    if (ev.data.type === 'highlight') {
      const { nodeId, neighborIds = [] } = ev.data;
      const node = nodesById.get(nodeId);
      if (!node) { showFocus(null, nodeId); return; }
      applyHighlight(nodeId, neighborIds);
      showFocus(node);
      flyTo(node);
    } else if (ev.data.type === 'clear') {
      clearHighlight();
    }
  });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
<!-- CANVAS_HEIGHT: 540 -->
<title>World Map of Cultural Self-Regulation Practices</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { font-family: Arial, Helvetica, sans-serif; background: white; }
  main { display: block; width: 100%; padding: 8px; }
  h3 { text-align: center; color: navy; font-size: 18px; margin: 2px 0; }
  .subtitle { text-align: center; color: dimgray; font-size: 13px; margin-bottom: 6px; }
  #map { width: 100%; height: 340px; border: 1px solid silver; border-radius: 6px; background: #dceef2; }
  .emoji-icon { font-size: 22px; text-align: center; line-height: 26px; text-shadow: 0 0 3px white, 0 0 3px white; }
  .region-label { color: #4d4d4d; font-size: 11px; font-weight: bold; text-align: center; text-shadow: 0 0 3px white, 0 0 3px white; white-space: nowrap; }
  .infobox { margin-top: 8px; background: #f7fbfb; border-left: 5px solid seagreen; border-radius: 4px; padding: 9px 11px; font-size: 14px; color: #334155; line-height: 1.5; min-height: 84px; }
  .infobox strong { color: navy; }
  .infobox .closing { display: block; margin-top: 6px; color: goldenrod; font-weight: bold; }
  .leaflet-container { font: inherit; }
</style>
</head>
<body>
<main>
  <h3>Calming Strong Feelings Around the World</h3>
  <div class="subtitle">Click each marker to learn a calming tradition. There is no single "right" way to settle big emotions.</div>
  <div id="map"></div>
  <div class="infobox" id="infobox">People everywhere have gentle ways to calm strong feelings. Click any marker on the map to explore a tradition and how it helps.</div>
</main>
<script>
const box = document.getElementById('infobox');
const closingNote = 'There are many more traditions than shown here. What matters is finding a calming practice that fits you and your family.';
let clickCount = 0;
const clicked = {};

function show(id, html){
  if (!clicked[id]) { clicked[id] = true; clickCount++; }
  let out = html;
  if (clickCount >= 2) {
    out += '<span class="closing">' + closingNote + '</span>';
  }
  box.innerHTML = out;
}

// Simple CRS world grid: x = longitude-like 0..360, y = latitude-like 0..180 (north = high)
const map = L.map('map', { crs: L.CRS.Simple, minZoom: -2, maxZoom: 1, zoomControl: true, attributionControl: false });
const bounds = [[0,0],[160,360]];
map.fitBounds(bounds);
map.setMaxBounds(bounds);

// --- Schematic land masses (light gray/green) so it reads as a generic world, not a real map ---
const land = L.layerGroup().addTo(map);
function landmass(pts){
  L.polygon(pts, { color:'#c7d6c0', weight:1, fillColor:'#e6efe0', fillOpacity:1 }).addTo(land);
}
// North America
landmass([[140,25],[158,68],[140,116],[96,120],[86,78],[102,44]]);
// South America
landmass([[86,92],[94,136],[56,168],[32,142],[40,104],[64,88]]);
// Europe
landmass([[138,178],[156,206],[134,224],[114,218],[118,186]]);
// Africa
landmass([[116,192],[132,236],[92,294],[60,256],[72,206],[96,188]]);
// Asia
landmass([[136,224],[162,244],[156,320],[110,328],[96,272],[118,232]]);
// Australia / Pacific area
landmass([[56,306],[74,330],[54,346],[32,338],[36,310]]);

function emoji(y,x,ch,size){ return L.marker([y,x], { icon: L.divIcon({ className:'emoji-icon', html:ch, iconSize:[size||26,size||26] }) }); }
function label(y,x,text,w){ return L.marker([y,x], { icon: L.divIcon({ className:'region-label', html:text, iconSize:[w||120,16] }) }); }

// --- 1. South / East Asia: mindfulness meditation ---
const meditation = L.layerGroup([
  emoji(126,288,'🧘').on('click',()=>show('meditation','<strong>Mindfulness meditation — South and East Asia.</strong> Sitting quietly and slowly noticing your breath is a very old calming tradition here. Paying gentle attention to right now helps a racing mind and body settle down.')),
  label(112,288,'Mindfulness')
]).addTo(map);

// --- 2. West Africa: music & drumming ---
const drumming = L.layerGroup([
  emoji(104,208,'🥁').on('click',()=>show('drumming','<strong>Music and drumming — West Africa.</strong> Playing rhythms on drums and moving to a steady beat is a shared way to let go of tension. Making music together turns strong feelings into sound and helps release them.')),
  label(90,208,'Drumming')
]).addTo(map);

// --- 3. North America Indigenous nations: storytelling & nature ---
const storytelling = L.layerGroup([
  emoji(128,68,'📖').on('click',()=>show('storytelling','<strong>Storytelling and nature — Indigenous nations of North America.</strong> Many Northern Plains and other Indigenous communities calm the heart through shared stories and time in nature. Listening to a story and connecting to the land can bring comfort and steady, calm feelings.')),
  label(114,68,'Storytelling')
]).addTo(map);

// --- 4. Latin America & Pacific Islands: dance & movement ---
const dance = L.layerGroup([
  emoji(68,116,'💃').on('click',()=>show('dance','<strong>Dance and movement — Latin America.</strong> Moving your body to music is a joyful way to release built-up energy and tension. Dancing can lift a heavy mood and help big feelings flow out in a healthy way.')),
  label(54,116,'Dance'),
  emoji(50,320,'🕺').on('click',()=>show('dance','<strong>Dance and movement — Pacific Islands.</strong> Island communities also use dance and rhythmic movement to express and calm strong emotions. Moving together as a group brings people closer and helps settle the heart.')),
  label(36,320,'Movement',90)
]).addTo(map);

// --- 5. Middle East, South Asia, worldwide faith communities: prayer & quiet reflection ---
const prayer = L.layerGroup([
  emoji(120,244,'🙏').on('click',()=>show('prayer','<strong>Prayer and quiet reflection — faith communities worldwide.</strong> In the Middle East, South Asia, and many faith communities around the world, people pause to pray or reflect quietly. Taking that calm, still moment can bring peace and comfort when feelings are strong.')),
  label(106,244,'Prayer &amp; reflection',150)
]).addTo(map);

// --- 6. Worldwide: family-specific blended practices ---
const family = L.layerGroup([
  emoji(48,175,'🌍').on('click',()=>show('family','<strong>Your own family traditions — everywhere.</strong> Every family blends its own calming habits, like a bedtime routine, a favorite song, or a quiet walk together. The best calming practice is the one that feels right for you and the people you love.')),
  label(34,175,'Family blends',120)
]).addTo(map);

L.control.layers(null, {
  '🧘 Mindfulness (S/E Asia)': meditation,
  '🥁 Drumming (West Africa)': drumming,
  '📖 Storytelling (N. America)': storytelling,
  '💃 Dance (Latin Am. & Pacific)': dance,
  '🙏 Prayer & reflection': prayer,
  '🌍 Family blends (worldwide)': family
}, { collapsed: false, position: 'topright' }).addTo(map);
</script>
</body>
</html>

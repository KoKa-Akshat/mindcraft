# fly.toml app configuration file generated for mindcraft-tts on 2026-08-20T21:21:29-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mindcraft-tts'
primary_region = 'ord'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

# Bumped 1gb -> 2gb, 2026-08-21: a real OOM kill happened tonight
# (exit_code=137, oom_killed=true) under live Kokoro TTS load - 1gb wasn't
# enough headroom for the model + concurrent request buffers. Confirmed
# live: after the kill, the health check sat critical and a real synth
# request took 27.6s (client-side timeout is 12s, see KokoroTTSClient.swift
# - anything past that silently falls back to the native/robotic voice,
# which is the exact "voice reverted to the old one" bug this fixes).
[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'

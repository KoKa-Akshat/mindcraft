<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MindCraft Field Desk</title>
<meta name="description" content="A calm, fluid MindCraft workspace with draggable papers, live transcription, and pinned notes.">
<link rel="icon" type="image/png" href="img/favicon-raccoon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito+Sans:wght@700;800;900;1000&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --ink:#070908;
    --paper:#fbfbf7;
    --lime:#c4f547;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:100%; min-height:100%; overflow:hidden;}
  body{
    font-family:"Nunito Sans",system-ui,sans-serif;
    color:var(--paper); background:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  button,textarea,input{font:inherit;}
  button{color:inherit;}
  img{display:block; width:100%; height:100%; object-fit:cover;}

  .desk{
    position:relative; width:100vw; height:100svh; min-height:560px;
    overflow:hidden; isolation:isolate; background:#080a09;
  }
  .desk::before{
    content:""; position:absolute; inset:-2%; z-index:-2;
    background:
      linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.22)),
      url("img/app/field-desk-black-background.png") center/cover no-repeat;
  }
  .desk::after{
    content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(circle at 50% 44%,transparent 0 32%,rgba(0,0,0,.16) 72%,rgba(0,0,0,.42) 100%),
      radial-gradient(circle,rgba(255,255,255,.44) 1.35px,transparent 1.8px);
    background-size:auto,52px 52px;
    background-position:center,18px 18px;
    opacity:.82;
  }

  .scene{
    position:absolute; inset:clamp(24px,5vw,76px);
    transform:translate3d(var(--pan-x,0),var(--pan-y,0),0);
    transition:transform .7s var(--ease);
  }
  .scene::before{
    content:""; position:absolute; left:20%; right:20%; bottom:-8%; height:26%;
    background:radial-gradient(ellipse,rgba(0,0,0,.74),transparent 70%);
    filter:blur(16px); pointer-events:none;
  }

  .tile{
    position:absolute; z-index:2; overflow:visible; padding:7px;
    border:1px solid rgba(255,255,255,.58); border-radius:16px;
    background:rgba(255,255,255,.96); color:#163b30;
    box-shadow:0 26px 72px rgba(0,0,0,.46),inset 0 1px 0 #fff;
    transform:translate3d(var(--x,0px),var(--y,0px),0) rotate(var(--r,0deg));
    transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .2s ease;
    cursor:grab; touch-action:none; user-select:none;
  }
  .tile:hover{
    border-color:rgba(196,245,71,.74);
    box-shadow:0 32px 88px rgba(0,0,0,.58),0 0 0 5px rgba(196,245,71,.06);
  }
  .tile.is-dragging{z-index:30; cursor:grabbing; transition:none;}
  .tile img{border-radius:11px; pointer-events:none;}
  .tile-label{
    position:absolute; left:3px; top:-28px; white-space:nowrap;
    color:rgba(255,255,255,.68); font-size:12px; font-weight:1000;
    letter-spacing:.02em; text-shadow:0 2px 14px #000;
  }

  .kitchen{
    left:31%; top:4%; width:38%; height:68%; z-index:7; --r:-.35deg;
    border:1px solid rgba(255,255,255,.74);
  }
  button.kitchen{appearance:none; text-align:left;}
  .kitchen::after{
    content:""; position:absolute; inset:7px; border-radius:11px; pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .worksheet{left:5%; top:16%; width:29%; height:25%; --r:-1.1deg;}
  .worksheet img{object-position:center top;}
  .binder{right:4%; top:18%; width:28%; height:25%; --r:.9deg;}
  .binder-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px; height:100%;}
  .portal{right:7%; bottom:3%; width:23%; aspect-ratio:1/1; --r:1.4deg;}
  .portal img{object-fit:cover;}

  .transcript{
    position:absolute; z-index:14; left:50%; top:52%; width:min(320px,30vw);
    transform:translateX(-50%); padding:15px 16px 14px; border-radius:18px;
    border:1px solid rgba(255,255,255,.12); background:rgba(5,9,7,.88);
    box-shadow:0 24px 68px rgba(0,0,0,.48);
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
    pointer-events:none;
  }
  .transcript-head{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .transcript-head b{
    color:rgba(255,255,255,.58); font-size:10px; font-weight:1000;
    letter-spacing:.16em; text-transform:uppercase;
  }
  .voice{height:16px; display:flex; align-items:flex-end; gap:3px;}
  .voice i{width:3px; border-radius:9px; background:var(--lime); animation:voice 1s ease-in-out infinite;}
  .voice i:nth-child(1){height:7px;}
  .voice i:nth-child(2){height:14px; animation-delay:.12s;}
  .voice i:nth-child(3){height:10px; animation-delay:.24s;}
  .voice i:nth-child(4){height:16px; animation-delay:.36s;}
  .transcript p{margin-top:10px; font-size:14px; line-height:1.35; font-weight:1000; color:rgba(255,255,255,.92);}
  .transcript span{display:block; margin-top:6px; font-size:11px; line-height:1.35; font-weight:900; color:rgba(255,255,255,.48);}
  @keyframes voice{0%,100%{transform:scaleY(.52);opacity:.5}50%{transform:scaleY(1);opacity:1}}

  .add-note{
    position:fixed; z-index:50; top:max(24px,env(safe-area-inset-top)); right:max(24px,env(safe-area-inset-right));
    width:56px; height:56px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.8);
    border-radius:50%; background:var(--paper); color:var(--ink); font-size:31px; line-height:1;
    box-shadow:0 18px 48px rgba(0,0,0,.42); cursor:pointer;
    transition:transform .22s var(--ease),background .22s ease;
  }
  .add-note:hover{transform:translateY(-2px) rotate(4deg); background:var(--lime);}
  .add-note[aria-expanded="true"]{transform:rotate(45deg); background:var(--lime);}

  .note-composer{
    position:fixed; z-index:49; top:max(92px,calc(env(safe-area-inset-top) + 68px));
    right:max(24px,env(safe-area-inset-right)); width:min(320px,calc(100vw - 32px));
    padding:14px; border:1px solid rgba(255,255,255,.7); border-radius:18px;
    background:rgba(250,250,246,.97); color:#143a2e; box-shadow:0 28px 80px rgba(0,0,0,.52);
    opacity:0; transform:translateY(-8px) scale(.98); pointer-events:none;
    transition:opacity .22s var(--ease),transform .22s var(--ease);
  }
  .note-composer.is-open{opacity:1; transform:none; pointer-events:auto;}
  .note-composer label{
    display:block; margin:2px 2px 9px; color:rgba(20,58,46,.52);
    font-size:10px; font-weight:1000; letter-spacing:.15em; text-transform:uppercase;
  }
  .note-composer textarea{
    display:block; width:100%; min-height:104px; resize:none; padding:12px;
    border:1px solid rgba(20,58,46,.14); border-radius:13px; outline:none;
    background:#fff; color:#143a2e; font-size:14px; line-height:1.4; font-weight:800;
  }
  .note-composer textarea:focus{border-color:#247a4d; box-shadow:0 0 0 3px rgba(36,122,77,.1);}
  .pin-note{
    width:100%; min-height:43px; margin-top:9px; border:0; border-radius:12px;
    background:#08100d; color:#fff; font-size:11px; font-weight:1000;
    letter-spacing:.12em; text-transform:uppercase; cursor:pointer;
  }
  .note-status{min-height:15px; margin:7px 2px 0; color:rgba(20,58,46,.5); font-size:10px; font-weight:900;}

  .memo{
    width:230px; min-height:150px; padding:18px 18px 20px; background:#f7f4dc;
    color:#183c31; border-color:rgba(255,255,255,.7); --r:-1.2deg;
  }
  .memo::before{
    content:""; position:absolute; top:13px; left:50%; width:46px; height:9px;
    transform:translateX(-50%) rotate(-2deg); background:rgba(196,245,71,.58);
  }
  .memo b{display:block; margin-top:14px; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(20,58,46,.5);}
  .memo p{margin-top:9px; font-family:"Fredoka",sans-serif; font-size:17px; line-height:1.25; font-weight:600; overflow-wrap:anywhere;}

  .command{
    position:fixed; z-index:45; left:50%; bottom:max(26px,env(safe-area-inset-bottom));
    width:min(620px,calc(100vw - 32px)); min-height:68px; padding:9px 9px 9px 20px;
    display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px;
    border:1px solid rgba(255,255,255,.18); border-radius:22px;
    background:rgba(7,10,8,.9); box-shadow:0 28px 90px rgba(0,0,0,.54);
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    opacity:0; transform:translate(-50%,12px) scale(.98); pointer-events:none;
    transition:opacity .24s var(--ease),transform .24s var(--ease);
  }
  .command.is-open{opacity:1; transform:translate(-50%,0); pointer-events:auto;}
  .command input{
    min-width:0; border:0; outline:0; background:transparent; color:#fff;
    font-size:15px; font-weight:900;
  }
  .command input::placeholder{color:rgba(255,255,255,.42);}
  .command button{
    width:50px; height:50px; border:0; border-radius:15px; background:var(--lime);
    color:#07110e; font-size:20px; font-weight:1000; cursor:pointer;
  }

  @media(max-width:820px){
    .scene{inset:72px 18px 36px;}
    .kitchen{left:18%; top:6%; width:64%; height:57%;}
    .worksheet{left:-8%; top:19%; width:35%; height:20%;}
    .binder{right:-8%; top:22%; width:34%; height:20%;}
    .portal{right:2%; bottom:4%; width:31%;}
    .transcript{top:43%; width:min(300px,58vw);}
    .tile-label{top:-23px; font-size:10px;}
  }
  @media(max-width:520px){
    .desk{min-height:520px;}
    .desk::after{background-size:auto,42px 42px; background-position:center,12px 12px;}
    .scene{inset:76px 12px 82px;}
    .kitchen{left:13%; top:4%; width:74%; height:53%; padding:5px; border-radius:13px;}
    .kitchen img{border-radius:8px;}
    .worksheet{left:-15%; top:20%; width:40%; height:18%; padding:5px;}
    .binder{right:-13%; top:22%; width:39%; height:18%; padding:5px;}
    .binder-grid{gap:4px;}
    .portal{right:-2%; bottom:2%; width:37%; padding:5px;}
    .transcript{top:39%; width:64vw; padding:12px 13px; border-radius:15px;}
    .transcript p{font-size:12px;}
    .transcript span{font-size:10px;}
    .add-note{top:max(16px,env(safe-area-inset-top)); right:16px; width:50px; height:50px;}
    .note-composer{top:max(76px,calc(env(safe-area-inset-top) + 58px)); right:16px;}
    .memo{width:180px; min-height:126px; padding:14px;}
    .memo p{font-size:15px;}
    .command{bottom:max(16px,env(safe-area-inset-bottom)); min-height:60px; padding:7px 7px 7px 15px; border-radius:18px;}
    .command input{font-size:13px;}
    .command button{width:46px; height:46px; border-radius:13px;}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important;}
  }
</style>
</head>
<body>
<main class="desk" id="desk" aria-label="MindCraft Field Desk prototype">
  <div class="scene" id="scene">
    <button class="tile kitchen" id="kitchen" type="button" data-draggable aria-expanded="false" aria-controls="command" aria-label="Open Jesse's Kitchen prompt">
      <span class="tile-label">Jesse's Kitchen</span>
      <img src="img/app/desk-ipad-live.png?v=jesse-desk-1" alt="Jesse's Kitchen inside MindCraft Field Desk">
    </button>

    <article class="tile worksheet" data-draggable>
      <span class="tile-label">Worksheet</span>
      <img src="img/sample-systems.pdf.png" alt="Systems of equations worksheet">
    </article>

    <article class="tile binder" data-draggable>
      <span class="tile-label">Binder</span>
      <div class="binder-grid">
        <img src="img/app/story-chapter.png" alt="Story chapter">
        <img src="img/app/practice.png" alt="Practice page">
      </div>
    </article>

    <article class="tile portal" data-draggable>
      <span class="tile-label">World</span>
      <img src="img/app/field-desk-portal.png" alt="Floating study portal">
    </article>

    <section class="transcript" aria-live="polite">
      <div class="transcript-head">
        <b>Auto transcribing</b>
        <span class="voice" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </div>
      <p id="transcriptLine">Jesse's Kitchen: graph both equations, then check where the lines meet.</p>
      <span id="transcriptMeta">Saving useful context as you work.</span>
    </section>

    <div id="noteLayer" aria-live="polite"></div>
  </div>

  <button class="add-note" id="addNote" type="button" aria-label="Add a note" aria-expanded="false" aria-controls="noteComposer">+</button>

  <form class="note-composer" id="noteComposer">
    <label for="noteText">New note</label>
    <textarea id="noteText" maxlength="180" placeholder="Write it here..."></textarea>
    <button class="pin-note" type="submit">Pin note</button>
    <div class="note-status" id="noteStatus">It will find a clear spot on the desk.</div>
  </form>

  <form class="command" id="command" aria-label="Ask Jesse's Kitchen">
    <input id="commandInput" maxlength="140" autocomplete="off" placeholder="Ask Jesse's Kitchen...">
    <button type="submit" aria-label="Send prompt">&rarr;</button>
  </form>
</main>

<script>
  (() => {
    const desk = document.getElementById('desk');
    const scene = document.getElementById('scene');
    const kitchen = document.getElementById('kitchen');
    const command = document.getElementById('command');
    const commandInput = document.getElementById('commandInput');
    const transcriptLine = document.getElementById('transcriptLine');
    const transcriptMeta = document.getElementById('transcriptMeta');
    const addNote = document.getElementById('addNote');
    const noteComposer = document.getElementById('noteComposer');
    const noteText = document.getElementById('noteText');
    const noteStatus = document.getElementById('noteStatus');
    const noteLayer = document.getElementById('noteLayer');
    const noteSpots = [
      { left:'8%', bottom:'4%', rotate:'-1.4deg' },
      { left:'38%', bottom:'1%', rotate:'.8deg' },
      { right:'31%', bottom:'5%', rotate:'-1deg' }
    ];

    let panX = 0;
    let panY = 0;
    let panning = false;
    let panStartX = 0;
    let panStartY = 0;
    let panBaseX = 0;
    let panBaseY = 0;

    const setPan = (x, y) => {
      const limit = matchMedia('(max-width:520px)').matches ? 20 : 36;
      panX = Math.max(-limit, Math.min(limit, x));
      panY = Math.max(-limit, Math.min(limit, y));
      scene.style.setProperty('--pan-x', panX.toFixed(1) + 'px');
      scene.style.setProperty('--pan-y', panY.toFixed(1) + 'px');
    };

    desk.addEventListener('pointerdown', event => {
      if (event.target.closest('button,input,textarea,.tile,.note-composer,.command')) return;
      panning = true;
      panStartX = event.clientX;
      panStartY = event.clientY;
      panBaseX = panX;
      panBaseY = panY;
      desk.setPointerCapture?.(event.pointerId);
    });
    desk.addEventListener('pointermove', event => {
      if (!panning) return;
      setPan(panBaseX + (event.clientX - panStartX) * .25, panBaseY + (event.clientY - panStartY) * .25);
    });
    ['pointerup','pointercancel'].forEach(type => desk.addEventListener(type, () => { panning = false; }));

    const makeDraggable = item => {
      let active = false;
      let moved = false;
      let startX = 0;
      let startY = 0;
      let baseX = Number(item.dataset.x || 0);
      let baseY = Number(item.dataset.y || 0);
      let minX = -240;
      let maxX = 240;
      let minY = -180;
      let maxY = 180;

      item.addEventListener('pointerdown', event => {
        if (event.button !== undefined && event.button !== 0) return;
        active = true;
        moved = false;
        startX = event.clientX;
        startY = event.clientY;
        baseX = Number(item.dataset.x || 0);
        baseY = Number(item.dataset.y || 0);
        const rect = item.getBoundingClientRect();
        minX = baseX + 12 - rect.left;
        maxX = baseX + innerWidth - 12 - rect.right;
        minY = baseY + 12 - rect.top;
        maxY = baseY + innerHeight - 12 - rect.bottom;
        item.classList.add('is-dragging');
        item.setPointerCapture?.(event.pointerId);
        event.stopPropagation();
      });

      item.addEventListener('pointermove', event => {
        if (!active) return;
        const deltaX = event.clientX - startX;
        const deltaY = event.clientY - startY;
        if (Math.abs(deltaX) + Math.abs(deltaY) > 5) moved = true;
        const safeX = Math.max(minX, Math.min(maxX, baseX + deltaX));
        const safeY = Math.max(minY, Math.min(maxY, baseY + deltaY));
        item.dataset.x = safeX.toFixed(1);
        item.dataset.y = safeY.toFixed(1);
        item.style.setProperty('--x', safeX.toFixed(1) + 'px');
        item.style.setProperty('--y', safeY.toFixed(1) + 'px');
        event.stopPropagation();
      });

      const finish = () => {
        if (!active) return;
        active = false;
        item.dataset.dragged = moved ? '1' : '0';
        item.classList.remove('is-dragging');
      };
      item.addEventListener('pointerup', finish);
      item.addEventListener('pointercancel', finish);
    };

    document.querySelectorAll('[data-draggable]').forEach(makeDraggable);

    kitchen.addEventListener('click', () => {
      if (kitchen.dataset.dragged === '1') {
        kitchen.dataset.dragged = '0';
        return;
      }
      const opening = !command.classList.contains('is-open');
      command.classList.toggle('is-open', opening);
      kitchen.setAttribute('aria-expanded', String(opening));
      if (opening) setTimeout(() => commandInput.focus({ preventScroll:true }), 80);
    });

    command.addEventListener('submit', event => {
      event.preventDefault();
      const prompt = commandInput.value.trim().slice(0, 140);
      if (!prompt) return;
      transcriptLine.textContent = prompt;
      transcriptMeta.textContent = "Working from Jesse's Kitchen and the open worksheet.";
      commandInput.value = '';
      command.classList.remove('is-open');
      kitchen.setAttribute('aria-expanded','false');
    });

    addNote.addEventListener('click', () => {
      const opening = !noteComposer.classList.contains('is-open');
      noteComposer.classList.toggle('is-open', opening);
      addNote.setAttribute('aria-expanded', String(opening));
      if (opening) setTimeout(() => noteText.focus({ preventScroll:true }), 80);
    });

    const addMemo = text => {
      const index = noteLayer.children.length;
      const spot = noteSpots[index % noteSpots.length];
      const memo = document.createElement('article');
      memo.className = 'tile memo';
      memo.dataset.draggable = '';
      Object.entries(spot).forEach(([key,value]) => {
        if (key === 'rotate') memo.style.setProperty('--r', value);
        else memo.style[key] = value;
      });
      const label = document.createElement('b');
      label.textContent = 'Pinned memo';
      const copy = document.createElement('p');
      copy.textContent = text;
      memo.append(label,copy);
      noteLayer.appendChild(memo);
      makeDraggable(memo);
    };

    noteComposer.addEventListener('submit', async event => {
      event.preventDefault();
      const text = noteText.value.trim().slice(0,180);
      if (!text) return;
      noteStatus.textContent = 'Organizing...';
      const payload = {
        note:text,
        source:'field_desk_prototype',
        context:'Jesse Kitchen worksheet',
        createdAt:new Date().toISOString()
      };
      let saved = false;
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(),3500);
        const response = await fetch('/api/marketing-note',{
          method:'POST',
          credentials:'same-origin',
          signal:controller.signal,
          headers:{
            'Content-Type':'application/json',
            'Accept':'application/json',
            'X-MindCraft-Intent':'pin-note'
          },
          body:JSON.stringify(payload)
        });
        clearTimeout(timeout);
        saved = response.ok;
      } catch (_) {
        saved = false;
      }
      addMemo(text);
      noteText.value = '';
      noteStatus.textContent = saved ? 'Pinned securely.' : 'Pinned locally for this preview.';
      noteComposer.classList.remove('is-open');
      addNote.setAttribute('aria-expanded','false');
    });

    const transcriptLines = [
      "Jesse's Kitchen: graph both equations, then check where the lines meet.",
      'Detected: systems of equations, likely substitution or graphing practice.',
      'Memo idea: ask why the intersection satisfies both equations.'
    ];
    let transcriptIndex = 0;
    setInterval(() => {
      if (command.classList.contains('is-open')) return;
      transcriptIndex = (transcriptIndex + 1) % transcriptLines.length;
      transcriptLine.textContent = transcriptLines[transcriptIndex];
    },5200);
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MindCraft</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Re-aligned to the marketing site's brand fonts (2026-08-05) -- this
         used to be its own DM Sans/Source Serif 4 pairing from the
         2026-07-23 consolidation pass, which left the app and index.html
         (the marketing site) loading two different type systems. Five
         roles now, matching index.html's own link exactly plus IBM Plex
         Mono (data/labels, app-only -- the marketing site has no data
         display): Fredoka (headings), Nunito Sans + Inter Tight (body/UI
         everywhere), DM Serif Display (story/chapter voice), Caveat (kept
         for genuinely decorative flourishes only -- see tokens.css),
         IBM Plex Mono (data/labels). -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Inter+Tight:wght@500;600;700;800;900&family=DM+Serif+Display:ital@0;1&family=Caveat:wght@400;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__MINDCRAFT_BUILD__ = '2026-06-24-practice-teal-v1'
      // GitHub Pages SPA redirect fix
      var redirect = sessionStorage.getItem('spa_redirect')
      if (redirect) {
        sessionStorage.removeItem('spa_redirect')
        window.history.replaceState(null, '', redirect)
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

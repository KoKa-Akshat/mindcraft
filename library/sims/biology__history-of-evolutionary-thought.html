    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Timeline of Evolutionary Thought</title>
    <link rel="stylesheet" href="https://unpkg.com/vis-timeline/standalone/umd/vis-timeline-graph2d.min.css">
    <style>/* Evolution Timeline MicroSim Styles */

body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: aliceblue;
    color: #333;
}

/* Header */
.header {
    background: linear-gradient(135deg, #2d5016, #4a7c2e);
    color: white;
    padding: 12px 20px;
    text-align: center;
}
.header h1 {
    margin: 0;
    font-size: 1.3em;
}
.header p {
    margin: 4px 0 0 0;
    font-size: 0.85em;
    opacity: 0.9;
}

/* Filter controls */
.controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    background: #f0f5eb;
    border-bottom: 1px solid #ccc;
}
.filter-btn {
    padding: 6px 14px;
    border: 2px solid #999;
    border-radius: 20px;
    background: white;
    cursor: pointer;
    font-size: 0.82em;
    font-weight: 600;
    transition: all 0.2s;
}
.filter-btn:hover { opacity: 0.85; }
.filter-btn.active { box-shadow: 0 0 0 2px #333; }
.filter-btn[data-category="all"] { border-color: #555; color: white; background: #555; }
.filter-btn[data-category="Pre-Darwin"] { border-color: #7f8c8d; color: white; background: #7f8c8d; }
.filter-btn[data-category="Darwin Era"] { border-color: #27ae60; color: white; background: #27ae60; }
.filter-btn[data-category="Modern Synthesis"] { border-color: #2980b9; color: white; background: #2980b9; }
.filter-btn[data-category="Molecular Era"] { border-color: #8e44ad; color: white; background: #8e44ad; }

/* Navigation buttons */
.nav-controls {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 6px 16px;
    background: #f0f5eb;
}
.nav-btn {
    padding: 4px 12px;
    border: 1px solid #aaa;
    border-radius: 4px;
    background: white;
    cursor: pointer;
    font-size: 0.8em;
    transition: background 0.2s;
}
.nav-btn:hover { background: #e8e8e8; }

/* Timeline Container */
#timeline {
    padding-left: 80px;
    padding-right: 80px;
    overflow: hidden;
}

/* Override vis-timeline clipping */
.vis-timeline {
    overflow: visible !important;
    border: none !important;
}
.vis-panel.vis-center {
    overflow: visible !important;
}
.vis-item .vis-item-overflow {
    overflow: visible !important;
}

/* Ensure all item boxes fit their text */
.vis-item .vis-item-content {
    white-space: nowrap !important;
    padding: 4px 8px !important;
}
.vis-item.vis-range {
    min-width: fit-content !important;
}
.vis-item.vis-box {
    min-width: fit-content !important;
}

/* Tooltip styling */
.vis-tooltip {
    background: #2c3e50 !important;
    color: white !important;
    padding: 10px 15px !important;
    border-radius: 8px !important;
    font-size: 13px !important;
    max-width: 300px !important;
    line-height: 1.4 !important;
    word-wrap: break-word !important;
    overflow-wrap: break-word !important;
    white-space: normal !important;
    box-sizing: border-box !important;
}
.vis-tooltip div {
    max-width: 280px !important;
    word-wrap: break-word !important;
    overflow-wrap: break-word !important;
    white-space: normal !important;
}

/* Info panel */
.info-panel {
    padding: 12px 20px;
    min-height: 60px;
}

/* Legend */
.legend {
    padding: 8px 12px;
    background: white;
    border-radius: 8px;
    border: 1px solid #ddd;
}
.legend h3 {
    margin: 0 0 8px 0;
    font-size: 0.85em;
    color: #555;
}
.legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    font-size: 0.8em;
}
.legend-color {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
}

/* Event detail card */
.event-detail {
    background: white;
    border-radius: 8px;
    border: 1px solid #ddd;
    padding: 12px 16px;
    display: none;
}
.event-detail.visible { display: block; }
.event-detail h3 {
    margin: 0 0 6px 0;
    font-size: 1em;
    color: #2d5016;
}
.event-detail .era-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.75em;
    font-weight: 600;
    color: white;
    margin-bottom: 8px;
}
.event-detail .description {
    font-size: 0.88em;
    line-height: 1.55;
    color: #444;
}
.event-detail .context {
    margin-top: 8px;
    padding: 8px 12px;
    background: #fef9e7;
    border-left: 3px solid #f39c12;
    border-radius: 0 6px 6px 0;
    font-size: 0.82em;
    line-height: 1.45;
    color: #7d6608;
}
.event-detail .context strong {
    color: #b7950b;
}

/* Placeholder text */
.event-placeholder {
    color: #888;
    font-size: 0.88em;
    font-style: italic;
    padding: 16px 0;
}

/* Instructions */
.instructions {
    text-align: center;
    font-size: 0.78em;
    color: #777;
    padding: 4px 16px 0 16px;
}

/* Responsive */
@media (max-width: 700px) {
    .info-panel {
        grid-template-columns: 1fr;
    }
    #timeline {
        padding-left: 20px;
        padding-right: 20px;
    }
    .header h1 { font-size: 1.1em; }
}
</style>
    <script src="https://unpkg.com/vis-timeline/standalone/umd/vis-timeline-graph2d.min.js"></script>
</head>
<body>

<div class="header">
    <h1>Timeline of Evolutionary Thought</h1>
    <p>From Linnaeus (1735) to the Human Genome Project (2003)</p>
</div>

<div class="controls">
    <button class="filter-btn active" data-category="all" onclick="filterCategory('all', this)">All Events</button>
    <button class="filter-btn" data-category="Pre-Darwin" onclick="filterCategory('Pre-Darwin', this)">Pre-Darwin</button>
    <button class="filter-btn" data-category="Darwin Era" onclick="filterCategory('Darwin Era', this)">Darwin Era</button>
    <button class="filter-btn" data-category="Modern Synthesis" onclick="filterCategory('Modern Synthesis', this)">Modern Synthesis</button>
    <button class="filter-btn" data-category="Molecular Era" onclick="filterCategory('Molecular Era', this)">Molecular Era</button>
</div>

<div class="nav-controls">
    <button class="nav-btn" onclick="panLeft()" title="Pan left">&#9664;</button>
    <button class="nav-btn" onclick="zoomIn()" title="Zoom in">+</button>
    <button class="nav-btn" onclick="zoomOut()" title="Zoom out">&minus;</button>
    <button class="nav-btn" onclick="fitAll()" title="Show all events">Fit All</button>
    <button class="nav-btn" onclick="panRight()" title="Pan right">&#9654;</button>
</div>

<div id="timeline"></div>

<p class="instructions">Click an event for details. Hover for context notes. Drag to pan, use buttons to zoom.</p>

<div class="info-panel">
    <div id="event-detail-container">
        <p class="event-placeholder">Click on any event in the timeline to see its full description and ap Biology context.</p>
        <div class="event-detail" id="event-detail">
            <span class="era-badge" id="detail-badge"></span>
            <h3 id="detail-title"></h3>
            <div class="description" id="detail-description"></div>
            <div class="context" id="detail-context"></div>
        </div>
    </div>
</div>

<div id="return-link" style="display:none; padding: 8px 16px;">
    <a href=".">&#8592; Return to Lesson Plan</a>
</div>

<script>const categoryColors = {
    'Pre-Darwin':       '#7f8c8d',
    'Darwin Era':       '#27ae60',
    'Modern Synthesis': '#2980b9',
    'Molecular Era':    '#8e44ad'
};

let timeline, timelineData, allItems, allEventsRaw;

fetch('timeline.json')
    .then(r => r.json())
    .then(data => {
        allEventsRaw = data.events;
        allItems = data.events.map((evt, i) => {
            const year = parseInt(evt.start_date.year);
            const month = evt.start_date.month ? parseInt(evt.start_date.month) - 1 : 0;
            const day = evt.start_date.day ? parseInt(evt.start_date.day) : 1;
            const item = {
                id: i,
                content: evt.text.headline,
                start: new Date(year, month, day),
                title: evt.notes || '',
                category: evt.group || 'Default',
                style: 'background-color:' + (categoryColors[evt.group] || '#555') +
                       '; color: white; border-color:' + (categoryColors[evt.group] || '#555') +
                       '; border-radius: 6px; padding: 4px 8px; font-size: 0.82em;'
            };
            if (evt.end_date) {
                const ey = parseInt(evt.end_date.year);
                const em = evt.end_date.month ? parseInt(evt.end_date.month) - 1 : 11;
                const ed = evt.end_date.day ? parseInt(evt.end_date.day) : 28;
                item.end = new Date(ey, em, ed);
                item.type = 'range';
            }
            return item;
        });

        timelineData = new vis.DataSet(allItems);

        const container = document.getElementById('timeline');
        const options = {
            width: '100%',
            height: '350px',
            margin: {
                item: { horizontal: 50, vertical: 10 },
                axis: 40
            },
            orientation: 'top',
            zoomMin: 1000 * 60 * 60 * 24 * 365 * 5,
            zoomMax: 1000 * 60 * 60 * 24 * 365 * 400,
            min: new Date(1700, 0, 1),
            max: new Date(2030, 0, 1),
            tooltip: { followMouse: true },
            stack: true,
            selectable: true,
            showCurrentTime: false,
            moveable: true,
            zoomable: false,
            align: 'center'
        };

        timeline = new vis.Timeline(container, timelineData, options);

        setWindowPadded(allItems);

        timeline.on('select', function(props) {
            if (props.items.length > 0) {
                showEventDetails(props.items[0]);
            }
        });
    });

function setWindowPadded(items) {
    const dates = items.map(item => item.start.getTime());
    if (items.some(i => i.end)) {
        items.forEach(i => { if (i.end) dates.push(i.end.getTime()); });
    }
    const minDate = Math.min(...dates);
    const maxDate = Math.max(...dates);
    const twoYears = 2 * 365 * 24 * 60 * 60 * 1000;
    timeline.setWindow(
        new Date(minDate - twoYears),
        new Date(maxDate + twoYears),
        { animation: false }
    );
}

function filterCategory(category, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    if (category === 'all') {
        timelineData.clear();
        timelineData.add(allItems);
        setWindowPadded(allItems);
    } else {
        const filtered = allItems.filter(item => item.category === category);
        timelineData.clear();
        timelineData.add(filtered);
        if (filtered.length > 0) setWindowPadded(filtered);
    }
}

function showEventDetails(itemId) {
    const evt = allEventsRaw[itemId];
    if (!evt) return;

    const detail = document.getElementById('event-detail');
    const placeholder = document.querySelector('.event-placeholder');
    const badge = document.getElementById('detail-badge');
    const title = document.getElementById('detail-title');
    const desc = document.getElementById('detail-description');
    const ctx = document.getElementById('detail-context');

    const color = categoryColors[evt.group] || '#555';
    badge.style.backgroundColor = color;
    badge.textContent = evt.group + ' \u2022 ' + evt.start_date.year + (evt.end_date ? '\u2013' + evt.end_date.year : '');
    title.innerHTML = evt.text.headline;
    desc.innerHTML = evt.text.text;

    if (evt.notes) {
        ctx.innerHTML = '<strong>ap Biology Context:</strong> ' + evt.notes;
        ctx.style.display = 'block';
    } else {
        ctx.style.display = 'none';
    }

    placeholder.style.display = 'none';
    detail.classList.add('visible');
}

function panLeft() {
    const range = timeline.getWindow();
    const span = range.end - range.start;
    timeline.setWindow(range.start - span * 0.3, range.end - span * 0.3, { animation: true });
}
function panRight() {
    const range = timeline.getWindow();
    const span = range.end - range.start;
    timeline.setWindow(range.start.getTime() + span * 0.3, range.end.getTime() + span * 0.3, { animation: true });
}
function zoomIn() {
    const range = timeline.getWindow();
    const center = (range.start.getTime() + range.end.getTime()) / 2;
    const span = range.end - range.start;
    timeline.setWindow(center - span * 0.25, center + span * 0.25, { animation: true });
}
function zoomOut() {
    const range = timeline.getWindow();
    const center = (range.start.getTime() + range.end.getTime()) / 2;
    const span = range.end - range.start;
    timeline.setWindow(center - span, center + span, { animation: true });
}
function fitAll() {
    setWindowPadded(allItems);
}

// Show return link only when not in iframe
if (window.self === window.top) {
    document.getElementById('return-link').style.display = 'block';
}
</script>

</body>
</html>

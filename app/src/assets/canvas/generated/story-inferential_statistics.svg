      <circle cx="70" cy="4" r="30" fill="none" stroke="#33230f" stroke-width="6"/>
      <rect x="-30" y="-38" width="70" height="16" rx="3" fill="#fbf3e2" stroke="#c99a3a" stroke-width="3"/>
    </g>
    <g transform="translate(430 500) rotate(18)">

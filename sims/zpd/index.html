<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch the frontier move · The Desk by MindCraft</title>
<meta name="description" content="Click a gold concept. Drag the graph. Watch the Zone of Proximal Development move.">
<link rel="canonical" href="https://joinmindcraft.com/sims/zpd/">
<style>
  :root{--ink:#e8efe4;--dim:#9aa89a;--field:#080e14;--lime:#c4f547;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--field);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
  body.embed{overflow:hidden;height:100%}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
  .bar b{font:600 13px/1 "Space Grotesk",Inter,sans-serif}
  .bar span{color:var(--dim);font-size:13px}
  .bar a{color:var(--lime);text-decoration:none;font-weight:600;font-size:13px}
  main{display:block;width:100%;max-width:920px;margin:0 auto;padding:8px 12px 24px}
  body.embed main{max-width:none;height:100%;padding:0}
  body.embed main canvas{display:block}
  .credit{padding:0 18px 16px;font-size:12px;color:var(--dim);max-width:920px;margin:0 auto}
  body.embed .bar, body.embed .credit{display:none}
</style>
</head>
<body>
  <div class="bar">
    <b>The Desk</b>
    <span>Drag the graph to move it. Click gold to master it.</span>
    <a href="/#reel">Back to The Desk</a>
  </div>
  <main></main>
  <p class="credit">Open MicroSim from the Learning Graphs textbook (CC BY-NC-SA). MindCraft did not write it. We host it here so you can move it without leaving the page.</p>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
  <script src="zpd-explorer.js"></script>
  <script src="host-pan.js"></script>
  <script>
    if (new URLSearchParams(location.search).get('embed') === '1') {
      document.body.classList.add('embed');
    }
  </script>
</body>
</html>

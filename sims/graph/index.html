<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin the graph · The Desk by MindCraft</title>
<meta name="description" content="Dan McCreary's learning graph in 3D. Drag to spin. Click a node.">
<link rel="canonical" href="https://joinmindcraft.com/sims/graph/">
<style>
  :root{--ink:#e8efe4;--dim:#9aa89a;--field:#080e14;--lime:#c4f547;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--field);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
  .bar{position:absolute;z-index:3;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px;background:linear-gradient(180deg,rgba(8,14,20,.92),rgba(8,14,20,0))}
  .bar b{font:600 13px/1 "Space Grotesk",Inter,sans-serif}
  .bar span{color:var(--dim);font-size:13px}
  .bar a{color:var(--lime);text-decoration:none;font-weight:600;font-size:13px}
  #graph{position:absolute;inset:0}
  .credit{position:absolute;z-index:3;left:18px;bottom:12px;right:18px;font-size:12px;color:var(--dim)}
  .credit a{color:var(--lime)}
  .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);z-index:2}
</style>
</head>
<body>
  <div class="bar">
    <b>The Desk</b>
    <span>Drag to spin. Click a node. 400 concepts from the open graph.</span>
    <a href="https://dmccreary.github.io/learning-graphs/sims/graph-viewer/main.html" target="_blank" rel="noopener">Dan's 2D viewer</a>
    <a href="/">Back to The Desk</a>
  </div>
  <div class="wait" id="wait">Loading the graph…</div>
  <div id="graph"></div>
  <p class="credit">Open learning graph from the Learning Graphs textbook, CC BY-NC-SA. MindCraft did not write the concepts. Drag to spin it here.</p>
  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
  <script>
    const COLORS = {
      FOUND:'#4fd1c5', DEPEND:'#7c6bc4', TAXON:'#2f8f5b', QUAL:'#c4f547',
      EDUF:'#f2b84b', LSCI:'#c4922a', PERS:'#e6d37a', AI:'#2a9d8f',
      ASSESS:'#4ea3f0', VISCORE:'#8ec8f0', VISLAYOUT:'#e05a5a', VISTOOLS:'#9b2c2c',
      DATA:'#9b7ed9', TEXTBOOK:'#6b4fc4', LMS:'#8a4fd4', SKILL:'#f07ab8'
    };
    const el = document.getElementById('graph');
    const wait = document.getElementById('wait');
    fetch('https://raw.githubusercontent.com/dmccreary/learning-graphs/master/docs/learning-graph/learning-graph.json')
      .then(r => { if (!r.ok) throw new Error('graph'); return r.json(); })
      .then(data => {
        const nodes = (data.nodes || []).map(n => ({
          id: n.id, name: n.label, group: n.group, color: COLORS[n.group] || '#8aa4b0'
        }));
        const links = (data.edges || []).map(e => ({ source: e.from, target: e.to }));
        wait.remove();
        const Graph = ForceGraph3D();
        Graph(el)
          .graphData({ nodes, links })
          .backgroundColor('#080e14')
          .nodeLabel(n => n.name)
          .nodeColor(n => n.color)
          .nodeRelSize(3.2)
          .linkColor(() => 'rgba(196,245,71,.22)')
          .linkOpacity(0.35)
          .linkDirectionalParticles(0)
          .showNavInfo(false);
      })
      .catch(() => {
        wait.textContent = 'Could not load the graph. Open Dan’s 2D viewer instead.';
      });
  </script>
</body>
</html>

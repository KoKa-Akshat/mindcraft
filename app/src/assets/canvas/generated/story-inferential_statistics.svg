    <path d="M-46 -30 Q0 10 46 -30" fill="none" stroke="#33230f" stroke-width="3.5" opacity="0.6"/>
    <path d="M-20 190 L-14 40 M20 190 L14 40" stroke="#33230f" stroke-width="2.5" opacity="0.35"/>
    <!-- arm -->
    <path d="M40 -10 Q92 -34 132 -70" fill="none" stroke="#3a3a3a" stroke-width="16" stroke-linecap="round"/>
      <path d="M40 -10 Q92 -34 132 -70" fill="none" stroke="#33230f" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
      <circle cx="136" cy="-73" r="9" fill="#e0b083" stroke="#33230f" stroke-width="3"/>
    
    
    <path d="M-40 -10 Q-70 30 -66 78" fill="none" stroke="#3a3a3a" stroke-width="16" stroke-linecap="round"/>

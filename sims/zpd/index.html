<style>

  html,body{height:100%;background:var(--field);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}

  .bar span{color:var(--dim);font-size:13px}
  .bar a{color:var(--lime);text-decoration:none;font-weight:600;font-size:13px}
  iframe{width:100%;height:calc(100% - 86px);border:0;background:#111}
  .credit{padding:8px 18px;font-size:12px;color:var(--dim)}

  <div class="bar">
